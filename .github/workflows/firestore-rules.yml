# Deploys firestore.rules whenever they change on main. Keyless: GitHub's OIDC token is exchanged for a
# short-lived Google credential (Workload Identity Federation), so there is no service-account key or secret.
# One-time Google Cloud setup: see "Deploy" in README.md.
name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/147169736788/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-rules-deployer@chip-stocks.iam.gserviceaccount.com
          token_format: access_token
      # firebase-tools can't use federated credentials, so publish through the Rules API directly:
      # create a ruleset from firestore.rules, then point the Firestore release at it.
      - name: Publish rules
        env: { TOKEN: '${{ steps.auth.outputs.access_token }}' }
        run: |
          set -o pipefail
          API=https://firebaserules.googleapis.com/v1/projects/chip-stocks
          H=(-H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")
          RULESET=$(jq -Rs '{source:{files:[{name:"firestore.rules",content:.}]}}' firestore.rules | curl -sS --fail-with-body "${H[@]}" -d @- "$API/rulesets" | jq -r .name)
          echo "created $RULESET"
          curl -sS --fail-with-body "${H[@]}" -X PATCH -d "{\"release\":{\"name\":\"projects/chip-stocks/releases/cloud.firestore\",\"rulesetName\":\"$RULESET\"}}" "$API/releases/cloud.firestore" | jq -r '"released " + .rulesetName'
