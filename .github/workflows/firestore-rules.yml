# Deploys firestore.rules whenever they change on main.
# One-time setup: add a repo secret FIREBASE_SERVICE_ACCOUNT containing a service-account JSON key
# for project chip-stocks with the "Firebase Rules Admin" role.
name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules --project chip-stocks --non-interactive
