<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chip · Stocks for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="firebase-config.js"></script>
<script src="chapters.js"></script>
<style>
/* Chip design system: indigo brand, caramel mascot, mint = correct, coral = wrong, gold = coins/progress */
:root{--pri:#5B4CF5;--pri-d:#4031D4;--pri2:#8B5CF6;--pri-l:#EFEDFF;--pri-b:#C9C2FF;
 --ok:#10B981;--ok-d:#0A9467;--ok-l:#DCF8EC;--bad:#FF5470;--bad-d:#DE3355;--bad-l:#FFE6EB;
 --gold:#FFB31A;--gold-d:#E09405;--gold-l:#FFF5DC;--fire:#FF7A1A;--fire-d:#D95F08;--sky:#1FA2FF;--sky-d:#0B84DB;
 --ink:#27253A;--ink2:#6B6883;--mute:#A8A5BD;--line:#ECE9F5;--soft:#F6F4FC;--bg:#FBFAFF;--card:#fff;
 --r:20px;--sh:0 10px 30px -12px rgba(39,37,58,.18);--hf:Fredoka,Nunito,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-weight:700;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3,.brand,.logo{font-family:var(--hf);font-weight:600;letter-spacing:-.2px}
:focus-visible{outline:3px solid var(--pri-b);outline-offset:2px}
/* buttons: chunky, sentence case, glossy top */
.btn{--c:var(--pri);--d:var(--pri-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;padding:14px 22px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%),var(--c);color:#fff;box-shadow:0 5px 0 var(--d);font-family:var(--hf);font-weight:600;font-size:18px;transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn:disabled{--c:var(--line);--d:#DDD9EA;color:var(--mute);cursor:default;filter:none;transform:none;background:var(--c)}
.btn.ok{--c:var(--ok);--d:var(--ok-d)}.btn.red{--c:var(--bad);--d:var(--bad-d)}.btn.gold{--c:var(--gold);--d:var(--gold-d)}.btn.sky{--c:var(--sky);--d:var(--sky-d)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{--c:var(--line);--d:#DDD9EA;background:var(--c);color:var(--mute);cursor:default;filter:none;transform:none}
.ci{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{font-size:19px}
/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,600px) 330px;justify-content:center;gap:40px;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;border-right:2px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.logo{display:flex;align-items:center;gap:8px;font-size:32px;color:var(--pri);padding:0 10px 18px}
.nav button{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:16px;font-family:var(--hf);font-weight:500;font-size:18px;color:var(--ink2);transition:background .15s}
.nav button span{font-size:26px;width:32px;text-align:center}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--pri-l);color:var(--pri)}
.side{padding:22px 0;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
main{padding-bottom:40px;min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:8px}
.stat{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line)}
.fire{color:var(--fire)}.fire.off{filter:grayscale(1);color:var(--mute)}.coin{color:var(--gold-d)}.heart{color:var(--bad)}.crs{color:var(--pri)}
@media(max-width:1120px){
 .shell{grid-template-columns:minmax(0,600px);gap:0}
 .side,.logo{display:none}
 .nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:2px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .nav button{flex-direction:column;gap:2px;padding:6px 14px;font-size:12px}.nav button span{font-size:24px}
 main{padding:0 16px 100px}
}
@media(max-width:600px){.sin .btn,.lfoot .btn{width:100%}.q{font-size:23px}.bubble{font-size:17px}}
@media(max-width:420px){.stat{padding:6px 9px;font-size:15px}.crs{display:none}}
/* path */
.unit{margin-top:14px}
.banner{position:sticky;top:70px;z-index:10;background:linear-gradient(120deg,var(--c),var(--c2));color:#fff;border-radius:24px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden;box-shadow:0 12px 26px -14px var(--c)}
.banner small{opacity:.85;font-weight:900;letter-spacing:1.2px;font-size:12px}
.banner h2{font-size:24px;margin:2px 0 2px}.banner p{opacity:.92;font-size:15px}
.bprog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:900}
.bprog i{display:block;width:120px;height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bprog i b{display:block;height:100%;background:#fff;border-radius:99px}
.bicon{font-size:64px;line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));margin-right:-6px}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:50px 0 70px;position:relative}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.row{transform:translateX(var(--x));position:relative;display:flex;justify-content:center;z-index:1}
/* level tiles: rounded "coins" with a rim, not circles */
.node{position:relative;width:76px;height:72px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--c);box-shadow:0 7px 0 var(--d),0 14px 20px -10px var(--d);display:grid;place-items:center;color:#fff;transition:filter .15s}
.node::after{content:"";position:absolute;inset:6px;border-radius:20px;border:2.5px solid rgba(255,255,255,.35);pointer-events:none}
.node:hover{filter:brightness(1.07)}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.node.lock{--c:#E4E1EE;--d:#C9C5D9;color:#B3AFC6;box-shadow:0 7px 0 var(--d)}
.node.lock::after{border-color:rgba(255,255,255,.6)}
.node.done{--c:var(--gold);--d:var(--gold-d)}
.node.jump{--c:#E4E1EE;--d:#C9C5D9;box-shadow:0 7px 0 var(--d),0 0 0 4px var(--gold-l)}
.node.cur::before{content:"";position:absolute;inset:-12px -12px -19px;border-radius:34px;border:4px solid var(--c);opacity:.25;z-index:-1}
.node svg{width:34px;height:34px}
.node .tro{font-size:34px}
.start{position:absolute;bottom:calc(100% + 18px);left:50%;translate:-50% 0;background:var(--card);border:2px solid var(--line);color:var(--c);padding:8px 14px;border-radius:14px;font-family:var(--hf);font-weight:600;font-size:16px;white-space:nowrap;z-index:2;box-shadow:var(--sh)}
.start::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border:2px solid var(--line);border-width:0 2px 2px 0;transform:translateX(-50%) rotate(45deg)}
.start.gold{color:var(--gold-d)}
.row:has(.start){margin-top:34px}
.pmascot{position:absolute;top:130px;z-index:1}
.pop{position:absolute;top:calc(100% + 22px);left:50%;translate:-50% 0;width:290px;background:var(--c);color:#fff;border-radius:22px;padding:18px;z-index:15;box-shadow:0 18px 40px -12px rgba(39,37,58,.4)}
.pop::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop h3{font-size:20px}.pop p{opacity:.92;margin:4px 0 14px}
.pop .btn{width:100%;background:#fff;color:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pop.lock{background:var(--card);color:var(--ink2);border:2px solid var(--line)}
.pop.lock .btn{background:var(--soft);color:var(--mute);box-shadow:none}
.pop.jump{--c:var(--gold-d)}
/* cards & pages */
.goal{display:flex;align-items:center;gap:12px;margin-top:12px}
.goal>span{font-size:30px}
.gbar{flex:1;height:20px;background:var(--line);border-radius:99px;position:relative;overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#FFCB57);border-radius:99px}
.gbar em{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-style:normal;color:#8A5A00}
.skill{display:flex;align-items:center;gap:12px;padding:8px 0}
.skill b{flex:1;font-size:15px}
.sbar{width:110px;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px}
.muted{color:var(--ink2);font-weight:600}
.mob{display:none}@media(max-width:1120px){.mob{display:block}}
.pagehead{display:flex;gap:18px;align-items:center;padding:8px 0 10px}
.pagehead h1{font-size:30px}
.sec{font-size:22px;margin:30px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc2{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.sc2 span{font-size:26px}.sc2 b{display:block;font-size:20px;font-family:var(--hf);font-weight:600}.sc2 small{color:var(--ink2)}
.list{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:0 18px}
.list>div{border-bottom:2px solid var(--line)}.list>div:last-child{border-bottom:0}
.ach{display:flex;gap:14px;align-items:center;padding:14px 0}
.ach .ae{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;font-size:30px;background:var(--gold);box-shadow:0 4px 0 var(--gold-d);flex:none}
.ach.no .ae{background:var(--line);box-shadow:0 4px 0 #DDD9EA;filter:grayscale(1)}
.ach div{flex:1}.ach .sbar{width:100%;margin-top:6px;height:12px}
.shopitem{display:flex;gap:14px;align-items:center;padding:16px 0}
.shopitem .ae{font-size:36px;width:60px;height:60px;border-radius:20px;background:var(--soft);display:grid;place-items:center;flex:none}
.shopitem div{flex:1}.shopitem .btn{min-width:118px;font-size:16px;padding:12px 16px}
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--pri-l),#FFF1E4);border-radius:24px;padding:18px;margin:6px 0 12px}
.hero h2{font-size:22px}
.fincard{display:flex;align-items:center;gap:16px;margin:10px 0 30px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}
.toggle .btn{min-width:110px;font-size:16px;padding:10px 16px}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.lesson[hidden]{display:none}
.lhead{width:100%;max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:24px 20px 10px}
.x{font-size:28px;color:var(--mute);line-height:1;width:36px;height:36px;border-radius:12px}
.x:hover{background:var(--soft);color:var(--ink2)}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;position:relative}
.bar i::after{content:"";position:absolute;top:4px;left:8px;right:8px;height:4px;background:rgba(255,255,255,.3);border-radius:99px}
.lhearts{color:var(--bad);font-weight:900;font-size:18px}
.stage{flex:1;overflow-y:auto;width:100%;max-width:620px;margin:0 auto;padding:18px 20px 30px}
.q{font-size:26px;margin:6px 0 18px;line-height:1.2}.q.c{text-align:center}
.tagline{font-weight:900;color:var(--pri2);letter-spacing:1px;text-transform:uppercase;font-size:13px}
.tagline.bad{color:var(--fire)}
.talk{display:flex;align-items:flex-end;gap:6px;margin:4px 0 22px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;font-size:18px;line-height:1.45;margin-bottom:30px;flex:1;min-height:56px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:20px;width:14px;height:14px;background:var(--card);border:2px solid var(--line);border-width:0 0 2px 2px;transform:rotate(45deg)}
.art{font-size:84px;text-align:center;margin:8px auto 4px;width:150px;height:150px;border-radius:44px;background:linear-gradient(135deg,var(--gold-l),var(--pri-l));display:grid;place-items:center;transform:rotate(-4deg)}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;font-size:17px;transition:background .15s,border-color .15s}
.opt:hover{background:var(--soft)}
.opt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.opt kbd{font:inherit;font-size:13px;color:var(--mute);border:2px solid var(--line);border-radius:9px;width:28px;height:28px;display:grid;place-items:center;flex:none}
.opts.pics .opt{flex-direction:column;text-align:center;padding:18px 12px;gap:8px}
.opts.pics kbd{position:absolute;top:10px;left:10px;width:24px;height:24px;font-size:12px}
.oe{font-size:44px}.oe.sm{font-size:30px}
.opt.sel{background:var(--pri-l);border-color:var(--pri-b);color:var(--pri)}.opt.sel kbd{border-color:var(--pri-b);color:var(--pri)}
.opt.good{background:var(--ok-l);border-color:var(--ok);color:var(--ok-d)}
.opt.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad-d)}
.line{min-height:112px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 0;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.chipw{padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-size:17px;background:var(--card)}
.chipw.used{background:var(--line);color:transparent;border-color:var(--line)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match>div{display:grid;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:64px}
.opt.gone{opacity:.35;pointer-events:none;background:var(--card);border-color:var(--line);color:var(--mute)}
.lfoot{border-top:2px solid var(--line);padding:22px 20px;background:var(--card)}
.lfoot>div{max-width:1000px;margin:0 auto;display:flex;justify-content:flex-end}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:24px 20px;z-index:3;visibility:hidden;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px -12px rgba(39,37,58,.2)}
.sheet.good{background:var(--ok-l);color:var(--ok-d)}.sheet.bad{background:var(--bad-l);color:var(--bad-d)}
.sin{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sico{width:60px;height:60px;border-radius:20px;background:var(--card);display:grid;place-items:center;font-size:32px;font-weight:900;flex:none}
.stxt{flex:1;min-width:180px}.stxt h3{font-size:24px}.stxt p{font-size:16px;margin-top:2px}.stxt .why{opacity:.85}
.combo{position:fixed;top:80px;left:50%;translate:-50% 0;background:var(--fire);color:#fff;padding:10px 18px;border-radius:99px;font-family:var(--hf);font-weight:600;font-size:19px;box-shadow:0 4px 0 var(--fire-d);z-index:5}
.fin{text-align:center;padding-top:10px}
.fin h1{font-size:34px;color:var(--pri);margin-top:8px}
.fin p{font-size:18px;color:var(--ink2);margin:6px 0 24px}
.fin .btn{margin:6px}
.stats{display:flex;gap:12px;justify-content:center}
.sc{flex:1;max-width:150px;border:2px solid var(--c);border-radius:20px;background:var(--c);overflow:hidden}
.sc b{display:block;color:#fff;font-size:12px;letter-spacing:.8px;padding:6px 0}
.sc div{background:var(--card);border-radius:18px;padding:14px 0;font-size:22px;font-weight:900;color:var(--c)}
.earn{margin-top:22px;font-size:20px;font-weight:900;color:var(--gold-d)}
.flame{font-size:120px;line-height:1}
.bign{font-family:var(--hf);font-size:96px;font-weight:600;color:var(--fire);line-height:1}
.fin h1.fire{color:var(--fire)}.fin h1.bad{color:var(--bad)}
.week{display:flex;gap:10px;justify-content:center;margin:26px 0 8px}
.week div{display:grid;gap:6px;justify-items:center;color:var(--ink2);font-size:14px}
.week i{width:34px;height:34px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-style:normal;color:#fff}
.week i.on{background:var(--fire)}
.modal{position:fixed;inset:0;background:rgba(39,37,58,.5);display:grid;place-items:end center;z-index:9}
.modal>div{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:28px;text-align:center;display:grid;gap:12px;justify-items:center}
input.name{width:100%;font:inherit;font-size:19px;padding:16px;border:2px solid var(--line);border-radius:18px;background:var(--card);outline:none;color:var(--ink)}
input.name::placeholder{color:var(--mute)}
input.name:focus{border-color:var(--pri-b);box-shadow:0 0 0 4px var(--pri-l)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
#fx i{position:absolute;top:0;left:50%;width:10px;height:14px;border-radius:3px}
.chip{overflow:visible;flex:none}
/* onboarding */
.boot{min-height:100vh;display:grid;place-items:center}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-weight:800;margin:14px 0;text-transform:uppercase;font-size:13px}.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.welcome{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px;background:radial-gradient(circle at 50% 30%,var(--pri-l),var(--bg) 62%)}
.wbox{position:relative;width:100%;max-width:400px;display:grid;justify-items:center;gap:12px;text-align:center}
.brand{font-size:60px;color:var(--pri);line-height:1;margin-top:4px}.tag{font-size:19px;color:var(--ink2);margin-bottom:18px}
.float{position:absolute;font-size:34px;opacity:.4;pointer-events:none;user-select:none}
.obtop{display:flex;align-items:center;gap:16px;max-width:640px;margin:0 auto;padding:22px 20px 6px}
.obtop .bar i{width:0}
.obbody{max-width:560px;margin:0 auto;padding:14px 20px 130px}
.obbody .talk{margin-bottom:26px}.obbody .name{margin-bottom:10px}
.obfoot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.obfoot .btn{display:flex;width:100%;max-width:560px;margin:0 auto}
.pwrap{position:relative}.pwrap .name{padding-right:54px}.eye{position:absolute;right:10px;top:8px;font-size:20px;padding:8px;opacity:.7}
.links{display:grid;justify-items:center;gap:2px;margin-top:10px}.err{color:var(--bad);min-height:22px;font-size:15px;margin:6px 0}.link{color:var(--pri);font-weight:800;padding:6px}
.gbtn{color:var(--ink)!important}
[data-theme=dark]{--ink:#ECEAF7;--ink2:#B4B1C9;--mute:#7D7A93;--line:#34314A;--soft:#2A2740;--bg:#17152A;--card:#211F35;--pri-l:#2E2A55;--gold-l:#3A3020;--ok-l:#173A2E;--bad-l:#3F1F28;--sh:0 10px 30px -12px rgba(0,0,0,.6)}
[data-theme=dark] .hero{background:linear-gradient(135deg,var(--pri-l),#3A2A2A)}
.av{font-size:58px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:3px solid var(--pri-b);flex:none}

<script>
/* ---------- content ---------- */
const I=(title,text,art)=>({t:'info',title,text,art});
const M=(q,opts,a,why,tag)=>{const o=opts.map(s=>{const [e,l]=s.includes('|')?s.split('|'):['',s];return{e,l}});return{t:'mc',q,opts:o,ans:o[a].l,why,tag}};
const T=(q,v,why,tag)=>({t:'mc',tf:1,q,opts:[{e:'👍',l:'True'},{e:'👎',l:'False'}],ans:v?'True':'False',why,tag});
const B=(q,answer,extra,tag)=>({t:'build',q,answer,extra,tag});
const P=(pairs,tag)=>({t:'match',pairs,tag});

const TAGS={share:'What a stock is',owner:'Being an owner',why:'Why companies sell',ipo:'IPOs',price:'Price moves',gain:'Gains & losses',div:'Dividends',market:'The market',ticker:'Ticker symbols',supply:'Supply & demand',risk:'Risk & diversifying',long:'Long-term thinking'};

const COURSE=[
{title:"What's a Stock?",sub:'Own a slice of a company',color:'#5B4CF5',c2:'#8B5CF6',dark:'#4031D4',icon:'🍕',lessons:[
 {title:'Own a Slice',items:[
  I('Meet the stock!','A company is like a giant pizza 🍕. A <b>stock</b> (also called a <b>share</b>) is one slice. Buy a slice and you own a tiny piece of the company!','🍕'),
  M('What is a stock?',['🍕|A piece of a company','🏦|A kind of bank','🎟️|A movie ticket','🧸|A toy you rent'],0,'A stock is a small piece of ownership in a company.','share'),
  T('If you own a share of a company, you own a tiny part of it.',true,'Yep! Owning shares makes you a part-owner.','owner'),
  I('Shareholders','People who own stocks are called <b>shareholders</b>. Even kids can be shareholders — with a grown-up’s help!','🙋'),
  M('Someone who owns stock is called a…',['🧑‍🍳|Chef','🙋|Shareholder','👮|Guard','🧑‍🏫|Teacher'],1,'Shareholder = someone who holds shares.','owner'),
  B('So… what is a stock?','A stock is a piece of a company',['bank','toy'],'share'),
  P([['Company','Whole pizza'],['Stock','One slice'],['Shareholder','Slice owner'],['Buy','Get a slice']],'share')]},
 {title:'Why Sell Shares?',items:[
  I('Growing costs money','Maya’s lemonade stand is a hit! 🍋 She wants a second stand but needs $100. She can <b>sell shares</b> to friends to raise the money.','🍋'),
  M('Why do companies sell stock?',['💰|To raise money to grow','🎉|To throw parties','🧹|To clean the office','😴|To take a nap'],0,'Selling shares brings in money to build and grow.','why'),
  T('When Maya sells shares, her friends become part-owners of the stand.',true,'Buying shares = owning a piece.','owner'),
  M('Maya sells 10 shares for $10 each. How much does she raise?',['$10','$100','$1,000','$1'],1,'10 × $10 = $100.','why'),
  I('The IPO','When a company sells shares to the public for the very first time, it’s called an <b>IPO</b> — an Initial Public Offering. It’s the company’s big debut! 🎤','🎤'),
  M('What does IPO stand for?',['Initial Public Offering','Internet Pizza Order','Important Price Oops','Invest, Pay, Owe'],0,'IPO = Initial Public Offering.','ipo'),
  B('Why do companies sell shares?','Companies sell shares to raise money',['spend','toys'],'why')]},
 {title:'Up & Down',items:[
  I('Prices move!','A stock’s price changes every day. When lots of people want it, the price goes <b>up</b> 📈. When fewer people want it, it goes <b>down</b> 📉.','📈'),
  M('Lots of people suddenly want SuperSneaks stock. What likely happens?',['📈|Price goes up','📉|Price goes down','➖|Nothing ever','❌|The stock vanishes'],0,'More buyers usually push the price up.','price'),
  T('A stock’s price stays the same forever once you buy it.',false,'Prices change all the time!','price'),
  I('Gains & losses','Buy at $5, sell at $8? You <b>gained</b> $3 🎉. Buy at $5, sell at $3? That’s a $2 <b>loss</b>. Stocks can go down too.','⚖️'),
  M('You buy a share for $5 and sell it for $8. What’s your gain?',['$3','$8','$13','$5'],0,'$8 − $5 = $3 gain.','gain'),
  M('You buy for $10 and sell for $7. What happened?',['📉|You lost $3','📈|You gained $3','🤷|Nothing happened','🚀|You gained $17'],0,'$7 − $10 = −$3, a loss.','gain'),
  P([['📈','Price up'],['📉','Price down'],['Gain','Sold for more'],['Loss','Sold for less']],'gain')]},
 {title:'Owner Perks',items:[

  M('A dividend is…',['🎁|Profit paid to owners','🧾|A bill you pay','🏷️|A coupon','📦|A free product'],0,'Dividends are a slice of profits paid to shareholders.','div'),
  T('Every company pays dividends.',false,'Many growing companies keep profits to grow instead.','div'),

  B('What perks do shareholders get?','Shareholders can vote and may get dividends',['never','pizza'],'div')]},
 {title:'Chapter Review',check:1}]},
{title:'The Stock Market',sub:'Where stocks are bought & sold',color:'#0FB5AE',c2:'#1FA2FF',dark:'#0A8A85',icon:'🏛️',lessons:[
 {title:'The Big Market',items:[

  I('Exchanges','Stocks trade on <b>exchanges</b> like the New York Stock Exchange (NYSE) and the Nasdaq. Today, most trading happens on computers! 💻','🏛️'),
  T('Most stock trading today happens on computers.',true,'Yep — trades zip around in milliseconds.','market'),
  M('Which of these is a stock exchange?',['🏛️|NYSE','🍔|NYPD','🏈|NFL','🚀|NASA'],0,'NYSE = New York Stock Exchange.','market'),
  B('Where do people trade stocks?','The stock market is where people trade stocks',['eat','sleep'],'market')]},
 {title:'Ticker Symbols',items:[
  I('Ticker symbols','Every stock has a short nickname called a <b>ticker symbol</b>. Apple is <b>AAPL</b>, Disney is <b>DIS</b>, Nike is <b>NKE</b>.','🏷️'),

  M('What is a ticker symbol?',['🏷️|A stock’s nickname','⏰|A kind of clock','🐛|A tiny bug','🎫|A lottery ticket'],0,'Tickers are short codes for stocks.','ticker'),
  M('Which ticker belongs to Disney?',['DIS','DSN','MICKEY','DNY'],0,'Disney trades as DIS.','ticker'),
  T('Ticker symbols are usually just a few letters long.',true,'Usually 1–5 letters.','ticker')]},

  M('Everyone wants the new RoboPup, but stores have only a few. The price will probably…',['📈|Go up','📉|Go down','🧊|Freeze','🎈|Float away'],0,'High demand + low supply = higher price.','supply'),
  M('A company has bad news and lots of people want to sell. The price will probably…',['📉|Go down','📈|Go up','🔁|Double','🤐|Stay secret'],0,'More sellers than buyers pushes price down.','supply'),
  T('Demand means how many people want to buy something.',true,'Right! Supply is how much is for sale.','supply'),
  P([['High demand','Price rises'],['Low demand','Price falls'],['Supply','Amount for sale'],['Demand','Amount wanted']],'supply')]},
 {title:'Egg Baskets',items:[
  I('Risk','Stocks can go up <i>or</i> down, so investing has <b>risk</b>. You could lose money — that’s why smart investors are careful. ⚠️','⚠️'),
  I('Diversify!','Don’t put all your eggs in one basket! Owning <b>many different</b> stocks means one bad egg won’t ruin everything.','🧺'),
  M('What does diversifying mean?',['🧺|Owning many different things','🥚|Buying just one stock','🎰|Guessing randomly','💸|Spending it all'],0,'Spread out = safer.','risk'),
  M('Which basket is safer?',['🧺|10 different companies','🥚|Just 1 company'],0,'If one company struggles, the others can help.','risk'),
  T('Investing in stocks has no risk at all.',false,'All investing has some risk.','risk'),
  B('What’s the golden rule?','Do not put all your eggs in one basket',['two','chicken'],'risk')]},
 {title:'Think Long-Term',items:[
  I('Patience is a superpower','Over many years, the stock market has generally grown — even with bumpy days along the way. Slow and steady! 🐢','🐢'),
  I('Compound growth','When your money grows, the growth can grow too! Like a snowball rolling downhill, it gets bigger and bigger. ⛄','⛄'),
  M('Why is investing for a long time helpful?',['🐢|Growth has time to build','⚡|You get rich overnight','🎲|It removes all risk','🙈|You never need to learn'],0,'Time lets compound growth do its magic.','long'),
  M('The market drops for a week. What might a patient investor do?',['🧘|Stay calm, think long-term','😱|Panic and sell everything','🙈|Throw away the computer','🍦|Only eat ice cream'],0,'Short dips are normal over the long run.','long'),
  P([['Snowball','Compound growth'],['Turtle','Patience'],['Basket','Diversify'],['Ticker','Stock nickname']],'long')]},
 {title:'Chapter Review',check:1}]}];
{const m=MORE_CHAPTERS(I,M,T,B,P);Object.assign(TAGS,m.tags);COURSE.push(...m.chapters)}

// streak freezes quietly cover missed days (one freeze per day) the next time the app opens
function useFreeze(){if(!S.lastDay||S.lastDay>=day(-1)||!S.streak)return;const miss=Math.round((new Date(day(-1))-new Date(S.lastDay))/864e5);if(miss<=S.freezes){S.freezes-=miss;S.lastDay=day(-1);save()}}

/* ---------- adaptive engine: Leitner boxes per concept ---------- */
const INTERVAL=[0,1,2,4,7,14]; // days until a concept is "due" again, by box
function mark(tag,ok){const m=S.mastery[tag]||{box:0,due:0,seen:0,right:0};m.seen++;if(ok){m.right++;m.box=Math.min(5,m.box+1)}else m.box=0;m.due=Date.now()+INTERVAL[m.box]*864e5;S.mastery[tag]=m}
const strength=t=>(S.mastery[t]?.box||0)/5;
const gradable=ls=>ls.flatMap(l=>(l.items||[]).filter(i=>i.t!=='info'));
// ponytail: score = weakness + overdue bonus + jitter; swap for per-item SM-2 if content grows large
function pickPractice(){const now=Date.now();return gradable(FLAT.filter(l=>S.done[l.id])).map(i=>{const m=S.mastery[i.tag]||{box:0,due:0};return[i,(1-m.box/5)*2+(m.due<=now)+Math.random()*.6]}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}
const weakTags=()=>Object.keys(S.mastery).sort((a,b)=>strength(a)-strength(b)||(S.mastery[a].right/S.mastery[a].seen)-(S.mastery[b].right/S.mastery[b].seen));

/* ---------- sound ---------- */
let AC;function beep(notes,type='sine',gap=.09,vol=.12){if(!S.sound)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const t=AC.currentTime;notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t+i*gap);g.gain.exponentialRampToValueAtTime(.001,t+i*gap+.28);o.connect(g).connect(AC.destination);o.start(t+i*gap);o.stop(t+i*gap+.3)})}catch{}}
const SFX={ok:()=>beep([784,1175]),bad:()=>beep([220,165],'square',.13,.05),tap:()=>beep([600],'triangle',0,.06),win:()=>beep([523,659,784,1047,1319],'triangle',.1),coin:()=>beep([988,1319],'square',.07,.05)};

 else gsap.timeline().to($('.m-head',c),{rotation:-8,y:6,transformOrigin:'50% 90%',duration:.2}).to($('.m-head',c),{rotation:8,duration:.12,repeat:3,yoyo:true}).to($('.m-head',c),{rotation:0,y:0,duration:.3})}
const wave=(c,n=3)=>gsap.fromTo($('.m-armR',c),{rotation:0},{rotation:-50,transformOrigin:'30% 10%',duration:.18,repeat:n*2-1,yoyo:true});
function confetti(){const fx=$('#fx'),cols=['#5B4CF5','#8B5CF6','#FFB31A','#10B981','#FF5470','#1FA2FF','#FF7A1A'];for(let i=0;i<90;i++){const p=document.createElement('i');p.style.background=pick(cols);fx.appendChild(p);gsap.fromTo(p,{x:0,y:innerHeight*.35,rotation:0},{x:(Math.random()-.5)*innerWidth*1.1,y:-innerHeight*.1+Math.random()*innerHeight*.3,rotation:Math.random()*720,duration:.8,ease:'power3.out'});gsap.to(p,{y:innerHeight+40,duration:1.6+Math.random(),delay:.8,ease:'power1.in',onComplete:()=>p.remove()})}}

/* ---------- app shell ---------- */
let tab='learn',justDone=null;
const TABS=[['learn','🏠','Learn'],['practice','🎯','Practice'],['league','🏆','Leagues'],['quests','📜','Quests'],['shop','🛍️','Shop'],['profile','🐂','Profile']];
function go(t=tab){tab=t;regen();applyTheme();useFreeze();loops.forEach(x=>x.kill());loops=[];
 if(!S.name)return onboard(user?1:0);
 $('#app').innerHTML=`<div class="shell"><nav class="nav"><div class="logo">${chip(40)}chip</div>${TABS.map(([k,e,n])=>`<button data-tab="${k}" class="${k===tab?'on':''}" aria-label="${n}"><span>${e}</span><b>${n}</b></button>`).join('')}</nav>
 <main><div class="top"><div class="stat crs">📈 Stocks</div><div class="stat fire ${S.lastDay===day()?'':'off'}" title="Day streak">🔥 ${streakNow()}</div>${boosted()?'<div class="stat" title="Double XP active">⚡2x</div>':''}${S.freezes?`<div class="stat" title="Streak freezes">🧊 ${S.freezes}</div>`:''}<div class="stat coin" title="Coins">${COIN} ${S.coins}</div><div class="stat heart" title="Hearts">❤️ ${S.hearts}</div></div>${({learn,practice,league,quests,shop,profile})[tab]()}</main>
 <aside class="side">${goalCard()}${questCard(1)}${skillsCard()}</aside></div>`;
 $$('[data-tab]').forEach(b=>b.onclick=()=>{SFX.tap();go(b.dataset.tab);scrollTo(0,0)});
 animateChips($('#app'));
 gsap.from('main > :not(.top)',{y:16,opacity:0,duration:.4,stagger:.05,ease:'power2.out'});
 if(tab==='learn')afterLearn();

function goalCard(){const x=dailyXP(),p=Math.min(100,x/S.goal*100);return `<div class="card"><h3>Daily Goal</h3><div class="goal"><span>⚡</span><div class="gbar"><i style="width:${p}%"></i><em>${x} / ${S.goal} XP</em></div><span>${p>=100?'🎉':'🎁'}</span></div></div>`}
function skillsCard(){const t=Object.keys(S.mastery);return `<div class="card"><h3>Your Skills</h3>${t.length?t.map(k=>{const s=strength(k);return `<div class="skill"><b>${TAGS[k]}</b><div class="sbar"><i style="width:${Math.max(6,s*100)}%;background:${s>.6?'var(--ok)':s>.2?'var(--gold)':'var(--bad)'}"></i></div></div>`}).join(''):'<p class="muted" style="margin-top:8px">Finish a lesson to see your skills grow!</p>'}</div>`}

/* quests */
const QUESTS=[['xp','⚡','Earn 30 XP',30,15],['lessons','📚','Complete 2 lessons',2,15],['perfects','💎','Get a perfect lesson',1,20]];
function questCard(mini){const q=Q();return `<div class="card"><h3>Daily Quests</h3>${QUESTS.map(([k,e,n,m,r])=>{const v=Math.min(q[k],m),got=q.claimed.includes(k);return `<div class="quest"><span>${e}</span><div><b>${n}</b><div class="sbar"><i style="width:${Math.max(4,v/m*100)}%;background:var(--gold)"></i></div><small class="muted">${v} / ${m}</small></div>${mini?(got?'✅':v>=m?'🎁':''):got?'<button class="btn ghost" disabled>Claimed</button>':`<button class="btn gold" data-claim="${k}" ${v<m?'disabled':''}>${COIN} ${r}</button>`}</div>`}).join('')}</div>`}
function quests(){return `<div class="pagehead"><div><h1>Quests</h1><p class="muted">New quests every day · claim chests for coins</p></div></div>${questCard()}
 <div class="card" style="margin-top:16px"><h3>Weekly XP</h3><p style="font-size:28px;margin-top:6px">⚡ ${weekXP()}</p><p class="muted">Resets every Monday. Compete with friends in Leagues!</p></div>`}
function claim(k){const q=Q(),x=QUESTS.find(z=>z[0]===k);if(!x||q.claimed.includes(k)||q[k]<x[3])return;q.claimed.push(k);S.coins+=x[4];save();SFX.coin();go()}

/* leagues & friends */
let FR=null; // cached friend profiles for this session
function league(){if(!user)return `<div class="pagehead"><h1>Leagues</h1></div><div class="hero">${chip(110)}<div><h2>Sign in to add friends</h2><p class="muted">Follow friends and race them on the weekly leaderboard.</p></div></div>`;
 if(!S.username)return `<div class="pagehead"><h1>Leagues</h1></div><div class="hero">${chip(110)}<div><h2>Pick a username first</h2><p class="muted">Friends find you by username.</p><button class="btn" id="setU" style="margin-top:10px">Edit profile</button></div></div>`;
 const me={uid:user.uid,...pub(),me:1},rows=[me,...(FR||[]).filter(f=>f.uid!==user.uid)].map(f=>({...f,w:f.weekId===wk()?f.weekXp:0})).sort((a,b)=>b.w-a.w);
 return `<div class="pagehead"><div><h1>Weekly League</h1><p class="muted">Ranked by XP this week · you are @${esc(S.username)}</p></div></div>
 <div class="card"><h3>Add friends</h3><div class="srow"><input class="name" id="fq" placeholder="Search username" autocomplete="off"><button class="btn" id="fgo">Follow</button></div><p class="err" id="ferr"></p></div>
 <div class="list" style="margin-top:16px">${FR?rows.map((f,i)=>`<div class="fr ${f.me?'me':''}"><b class="rk">${['🥇','🥈','🥉'][i]||i+1}</b><span class="fa">${esc(f.avatar||'🐂')}</span><div><b>${esc(f.name||f.username)}</b><br><small class="muted">@${esc(f.username)} · 🔥 ${f.streak||0}</small></div><b>${f.w} XP</b>${f.me?'':`<button class="btn ghost" data-unf="${f.uid}">Unfollow</button>`}</div>`).join(''):'<p class="muted" style="padding:16px 0">Loading friends…</p>'}</div>
 <p class="muted" style="margin-top:12px">${S.friends.length} following · <span id="fols">… followers</span></p>`}
async function loadFriends(){try{FR=await cloud.profiles(S.friends)}catch(e){console.error(e);FR=[]}if(tab==='league')go()}

const OFF=[0,52,78,52,0,-52,-78,-52];
const canJump=(l,cur)=>l.check&&S.level>0&&!S.done[l.id]&&LESSON[cur]?.ch===l.ch;
function learn(){const cur=curLesson();return COURSE.map((ch,ci)=>`<section class="unit"><div class="banner" style="--c:${ch.color};--c2:${ch.c2}"><div><small>CHAPTER ${ci+1}</small><h2>${ch.title}</h2><p>${ch.sub}</p><div class="bprog"><i><b style="width:${ch.lessons.filter(l=>S.done[l.id]).length/ch.lessons.length*100}%"></b></i>${ch.lessons.filter(l=>S.done[l.id]).length} / ${ch.lessons.length}</div></div><div class="bicon">${ch.icon}</div></div>
 <div class="path"><div class="pmascot" style="${ci%2?'right':'left'}:4%">${chip(120)}</div>${ch.lessons.map((l,li)=>{const st=S.done[l.id]?'done':l.id===cur?'cur':canJump(l,cur)?'jump':'lock';
 return `<div class="row" style="--x:${OFF[(li+ci*4)%8]}px;--c:${ch.color};--d:${ch.dark}">${st==='cur'?'<div class="start">Start</div>':st==='jump'?'<div class="start gold">Jump here?</div>':''}<button class="node ${st}" data-id="${l.id}" aria-label="${l.title}">${l.check?'<span class="tro">🏆</span>':st==='done'?ICO.check:ICO.star}</button></div>`}).join('')}</div></section>`).join('')+(FLAT.every(l=>S.done[l.id])?`<div class="card fincard">${chip(110)}<div><h3>You finished every chapter! 🎉</h3><p class="muted">New chapters are on the way. Keep your streak alive in the Practice tab!</p></div></div>`:'')}
function afterLearn(){drawTrails();gsap.to('.start',{y:-6,duration:.8,repeat:-1,yoyo:true,ease:'sine.inOut'});
 $$('.pmascot').forEach(m=>loops.push(gsap.timeline({repeat:-1,repeatDelay:4}).call(()=>wave(m,2))));
 const cur=$('.node.cur');
 if(justDone&&cur){cur.scrollIntoView({block:'center'});gsap.from(cur,{scale:0,duration:1,delay:.3,ease:'elastic.out(1,.45)'});justDone=null}
 else if(cur&&tab==='learn'&&!go._scrolled){go._scrolled=1;cur.scrollIntoView({block:'center'})}}
// the path is drawn like a stock chart: solid up to where you are, dashed after
function drawTrails(){$$('.path').forEach(p=>{const pr=p.getBoundingClientRect(),n=$$('.node',p).map(x=>{const r=x.getBoundingClientRect();return[r.left+r.width/2-pr.left,r.top+r.height/2-pr.top,x.classList.contains('done')]});
 const d=pts=>pts.map((q,i)=>i?`Q${pts[i-1][0]} ${(pts[i-1][1]+q[1])/2} ${(pts[i-1][0]+q[0])/2} ${(pts[i-1][1]+q[1])/2} T${q[0]} ${q[1]}`:`M${q[0]} ${q[1]}`).join(' ');
 const k=n.findIndex(q=>!q[2]),c=getComputedStyle(p.previousElementSibling).getPropertyValue('--c');
 p.insertAdjacentHTML('afterbegin',`<svg class="trail"><path d="${d(n)}" fill="none" stroke="var(--line)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 16"/>${k!==0?`<path class="tdone" d="${d(k<0?n:n.slice(0,k+1))}" fill="none" stroke="${c}" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>`:''}</svg>`)})}
const bind={learn(){$$('.node').forEach(n=>n.onclick=e=>{e.stopPropagation();SFX.tap();const had=n.parentNode.querySelector('.pop');$$('.pop').forEach(p=>p.remove());if(had)return;
  const l=LESSON[n.dataset.id],st=n.classList.contains('lock')?'lock':n.classList.contains('jump')?'jump':'';const pos=COURSE[l.ch].lessons.indexOf(l)+1;
  const p=document.createElement('div');p.className='pop '+st;
  p.innerHTML=st==='lock'?`<h3>${l.title}</h3><p>Finish all levels above to unlock this!</p><button class="btn" disabled>🔒 Locked</button>`:st==='jump'?`<h3>Jump ahead?</h3><p>Pass this review with 2 mistakes or fewer to skip the whole chapter.</p><button class="btn">Jump here +15 XP</button>`:`<h3>${l.title}</h3><p>${l.check?'Show what you learned!':`Lesson ${pos} of ${COURSE[l.ch].lessons.length}`}</p><button class="btn">${S.done[l.id]?'Practice +5 XP':`Start +${l.check?15:10} XP`}</button>`;
  n.parentNode.appendChild(p);gsap.from(p,{scale:.7,opacity:0,y:-10,duration:.35,ease:'back.out(2)'});
  if(st!=='lock')p.querySelector('.btn').onclick=()=>startLesson(l.id)});
 document.onclick=()=>$$('.pop').forEach(p=>p.remove())},
 league(){$('#setU')&&($('#setU').onclick=editProfile);if(!user||!S.username)return;if(!FR)loadFriends();
  cloud.followers(user.uid).then(n=>{const e=$('#fols');if(e)e.textContent=n+' followers'}).catch(()=>{});
  const fq=$('#fq'),err=$('#ferr');fq.onkeydown=e=>e.key==='Enter'&&$('#fgo').click();
  $('#fgo').onclick=async()=>{const u=fq.value.trim().toLowerCase().replace(/^@/,'');if(!u)return;err.textContent='';
   try{const f=await cloud.findUser(u);if(!f)return err.textContent='No one with that username.';if(f.uid===user.uid)return err.textContent='That’s you! 🐂';if(S.friends.includes(f.uid))return err.textContent='Already following.';
    S.friends=[...S.friends,f.uid];FR=[...(FR||[]),f];save();SFX.coin();go()}catch(e){console.error(e);err.textContent='Couldn’t search right now.'}};
  $$('[data-unf]').forEach(b=>b.onclick=()=>{S.friends=S.friends.filter(x=>x!==b.dataset.unf);FR=FR.filter(f=>f.uid!==b.dataset.unf);save();go()})},
 quests(){$$('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim))},
 practice(){$('#goP')&&($('#goP').onclick=()=>startLesson('practice'))},
 shop(){$$('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))},
 profile(){$('#snd').onclick=()=>{S.sound=!S.sound;save();go()};$('#so').onclick=()=>window.cloud?.signOut();$('#emo').onclick=()=>{S.emailOptIn=!S.emailOptIn;save();go()};$('#edp').onclick=editProfile;$('#thm').onclick=()=>{const t=['light','dark','auto'];S.theme=t[(t.indexOf(S.theme)+1)%3];save();go()};$$('[data-acc]').forEach(b=>b.onclick=()=>{S.accent=+b.dataset.acc;save();go()});$('#gl').onclick=()=>{const g=[10,20,30,50];S.goal=g[(g.indexOf(S.goal)+1)%4];save();go()};
  $('#rst').onclick=e=>{if(e.target.dataset.ok){S={...blank(),name:S.name,goal:S.goal,joined:S.joined,emailOptIn:S.emailOptIn,heartsAt:Date.now()};save();go()}else{e.target.dataset.ok=1;e.target.textContent='Tap again to erase everything'}}}};

 <div class="hero">${chip(110)}<div><h2>${n?`Hey ${esc(S.name)}! I made you a workout 💪`:'Finish your first lesson!'}</h2><p class="muted">${n?'I picked the questions you need most, based on what you’ve missed and what’s due for review.':'Then I’ll build practice sessions just for you.'}</p></div></div>
 ${n?`<div class="card"><h3>Focus skills</h3>${w.map(k=>{const s=strength(k);return `<div class="skill"><b>${TAGS[k]}</b><div class="sbar"><i style="width:${Math.max(6,s*100)}%;background:${s>.6?'var(--ok)':s>.2?'var(--gold)':'var(--bad)'}"></i></div></div>`}).join('')}<button class="btn wide" id="goP" style="margin-top:14px">Start practice +10 XP</button></div>`:''}
 <div class="mob" style="margin-top:16px">${goalCard()}</div>`}

/* shop */
const SHOP=[{id:'tie',n:'Bow Tie',d:'A dapper deal-maker',p:60,e:'🎀'},{id:'shades',n:'Cool Shades',d:'For bright bull markets',p:80,e:'🕶️'},{id:'hat',n:'Top Hat',d:'Very fancy investor',p:120,e:'🎩'},{id:'crown',n:'Gold Crown',d:'King of the market',p:250,e:'👑'},{id:'party',n:'Party Hat',d:'Celebrate every green day',p:90,e:'🥳'},{id:'monocle',n:'Monocle',d:'Read the fine print',p:110,e:'🧐'},{id:'scarf',n:'Cozy Scarf',d:'Warm in a bear market',p:100,e:'🧣'},{id:'phones',n:'Headphones',d:'Tune out the noise',p:150,e:'🎧'}];
const POWER=[{id:'refill',n:'Heart Refill',d:'Fill up all 5 hearts',p:50,e:'❤️'},{id:'freeze',n:'Streak Freeze',d:'Protects your streak for one missed day (max 2)',p:100,e:'🧊'},{id:'boost',n:'Double XP',d:'Earn 2x XP for 15 minutes',p:80,e:'⚡'}];
const SLOTS=[['hat','crown','party'],['shades','monocle'],['tie','scarf']];
function shop(){return `<div class="pagehead"><h1>Shop</h1></div><div class="hero" id="shopHero">${chip(130)}<div><h2>Dress up Chip!</h2><p class="muted">Earn ${COIN} by finishing lessons. Perfect lessons earn double.</p><p style="font-size:22px;color:var(--gold-d);margin-top:6px">${COIN} ${S.coins}</p></div></div>
 <h2 class="sec">Power-ups</h2><div class="list">${POWER.map(i=>{const full=i.id==='refill'?S.hearts>=5:i.id==='freeze'?S.freezes>=2:boosted(),lbl=i.id==='refill'?'Full':i.id==='freeze'?'Equipped 2/2':'Active';
  return `<div class="shopitem"><span class="ae">${i.e}</span><div><h3>${i.n}</h3><p class="muted">${i.d}</p></div><button class="btn" data-buy="${i.id}" ${full||S.coins<i.p?'disabled':''}>${full?lbl:COIN+' '+i.p}</button></div>`}).join('')}</div>
 <h2 class="sec">Outfits</h2><div class="list">${SHOP.map(i=>{const own=S.owned.includes(i.id),on=S.wear.includes(i.id);let b;
  b=own?`<button class="btn ${on?'ghost':''}" data-buy="${i.id}">${on?'Take off':'Wear'}</button>`:`<button class="btn gold" data-buy="${i.id}" ${S.coins<i.p?'disabled':''}>${COIN} ${i.p}</button>`;
  return `<div class="shopitem"><span class="ae">${i.e}</span><div><h3>${i.n}</h3><p class="muted">${i.d}</p></div>${b}</div>`}).join('')}</div>`}
function buy(id){const i=SHOP.find(x=>x.id===id)||POWER.find(x=>x.id===id);
 if(id==='refill'){if(S.coins<i.p||S.hearts>=5)return;S.coins-=i.p;S.hearts=5}
 else if(id==='freeze'){if(S.coins<i.p||S.freezes>=2)return;S.coins-=i.p;S.freezes++}
 else if(id==='boost'){if(S.coins<i.p||boosted())return;S.coins-=i.p;S.boostUntil=Date.now()+15*60e3}
 else if(!S.owned.includes(id)){if(S.coins<i.p)return;S.coins-=i.p;S.owned.push(id);S.wear.push(id)}
 else S.wear=S.wear.includes(id)?S.wear.filter(x=>x!==id):[...S.wear,id];
 const sl=SLOTS.find(g=>g.includes(id));if(sl&&S.wear.includes(id))S.wear=S.wear.filter(x=>x===id||!sl.includes(x));
 save();SFX.coin();go();react('happy',$('#shopHero'))}

 <h2 class="sec">Settings</h2><div class="list"><div class="toggle"><b>Sound effects</b><button class="btn ghost" id="snd">${S.sound?'On 🔊':'Off 🔇'}</button></div>
 <div class="toggle"><b>Daily goal</b><button class="btn ghost" id="gl">${S.goal} XP</button></div>

<script type="module">
const V='https://www.gstatic.com/firebasejs/11.0.2/';
const [{initializeApp},A,F]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(V+f)));
const app=initializeApp(window.FIREBASE_CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);
window.cloud={
 google:()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()),
 signUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
 signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
 reset:e=>A.sendPasswordResetEmail(auth,e),
 signOut:()=>A.signOut(auth),
 load:uid=>F.getDoc(F.doc(db,'users',uid)).then(s=>s.exists()?s.data():null),
 // mergeFields: replace app fields wholesale (so maps can shrink) but keep server-owned fields like `mail`
 save:(uid,d)=>F.setDoc(F.doc(db,'users',uid),d,{mergeFields:Object.keys(d)}),
 saveProfile:(uid,d)=>F.setDoc(F.doc(db,'profiles',uid),d),
 findUser:u=>F.getDocs(F.query(F.collection(db,'profiles'),F.where('username','==',u),F.limit(1))).then(q=>q.empty?null:{uid:q.docs[0].id,...q.docs[0].data()}),
 profiles:uids=>Promise.all(uids.map(u=>F.getDoc(F.doc(db,'profiles',u)).then(s=>s.exists()?{uid:u,...s.data()}:null))).then(a=>a.filter(Boolean)),
 followers:uid=>F.getCountFromServer(F.query(F.collection(db,'profiles'),F.where('following','array-contains',uid))).then(s=>s.data().count)};
A.onAuthStateChanged(auth,u=>window.onAuth(u));
</script>
