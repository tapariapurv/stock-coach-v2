<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chip · Stocks for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="firebase-config.js"></script>
<script src="chapters.js"></script>
<script src="fund.js"></script>
<script src="icons.js"></script>
<script src="mascot.js"></script>
<script src="game.js"></script>
<script src="social.js"></script>
<script src="practice.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B4CF5">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Chip design system: indigo brand, caramel mascot, mint = correct, coral = wrong, gold = coins/progress */
:root{--pri:#5B4CF5;--pri-d:#4031D4;--pri2:#8B5CF6;--pri-l:#EFEDFF;--pri-b:#CFC9FF;
 --ok:#10B981;--ok-d:#0A9467;--ok-l:#DCF8EC;--bad:#FF5470;--bad-d:#DE3355;--bad-l:#FFE6EB;
 --gold:#FFB31A;--gold-d:#E09405;--gold-l:#FFF5DC;--gold-ink:#7A4E00;--fire:#FF7A1A;--fire-d:#D95F08;--sky:#1FA2FF;--sky-d:#0B84DB;
 --ink:#1F1D33;--ink2:#625F7A;--mute:#A19EB8;--line:#E9E6F4;--soft:#F4F2FB;--bg:#F8F7FD;--card:#fff;
 --lock:#E6E3F0;--lock-d:#CBC7DB;--lock-ink:#ADA9C2;--dis:#ECEAF3;--dis-d:#D9D6E5;--warm:#FFF0E2;
 --r:22px;--rs:16px;--sh:0 1px 2px rgba(31,29,51,.05),0 8px 24px -12px rgba(31,29,51,.14);--sh2:0 24px 60px -20px rgba(31,29,51,.35);
 --hf:Fredoka,Nunito,system-ui,sans-serif;color-scheme:light}
[data-theme=dark]{--ink:#EEECF8;--ink2:#B3B0C9;--mute:#7E7B96;--line:#312E47;--soft:#26233A;--bg:#141225;--card:#1D1B30;
 --pri-l:#2B2752;--pri-b:#4A43A0;--gold-l:#3A2F1A;--gold-ink:#FFE2A6;--ok-l:#12352A;--bad-l:#3D1C27;--warm:#33231F;
 --lock:#2E2B45;--lock-d:#221F36;--lock-ink:#5F5B7A;--dis:#2A2740;--dis-d:#1F1C33;
 --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh2:0 24px 60px -20px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-weight:700;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3,.brand,.logo{font-family:var(--hf);font-weight:600;letter-spacing:-.2px;line-height:1.15}
:focus-visible{outline:3px solid var(--pri-b);outline-offset:2px}
small{font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* buttons: chunky 3D, sentence case */
.btn{--c:var(--pri);--d:var(--pri-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;padding:14px 22px;border-radius:var(--rs);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),var(--c);color:#fff;box-shadow:0 4px 0 var(--d);font-family:var(--hf);font-weight:600;font-size:18px;line-height:1.1;white-space:nowrap;transition:filter .15s,transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn.ok{--c:var(--ok);--d:var(--ok-d)}.btn.red{--c:var(--bad);--d:var(--bad-d)}.btn.gold{--c:var(--gold);--d:var(--gold-d)}.btn.sky{--c:var(--sky);--d:var(--sky-d)}
.btn:disabled,.btn[disabled],.btn.gold:disabled,.btn.ok:disabled,.btn.red:disabled{--c:var(--dis);--d:var(--dis-d);background:var(--c);color:var(--mute);cursor:default;filter:none;transform:none}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:none}
.btn.ghost:disabled{background:var(--soft);color:var(--mute);box-shadow:none}
.btn.wide{width:100%}
.btn.sm,.toggle .btn,.fr .btn,.quest .btn,.shopitem .btn,.ocard .btn,.hero .btn{min-width:0;font-size:15px;padding:10px 16px;border-radius:14px}
.ci{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card h3{font-size:18px}
.card>h3+*{margin-top:8px}
/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,620px) 340px;justify-content:center;gap:44px;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;border-right:1.5px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.logo{display:flex;align-items:center;gap:8px;font-size:32px;color:var(--pri);padding:0 10px 20px}
.nav button{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:2px solid transparent;font-family:var(--hf);font-weight:500;font-size:17px;color:var(--ink2);transition:background .15s,color .15s}
.nav button span{font-size:24px;width:32px;text-align:center;line-height:1}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--pri-l);border-color:var(--pri-b);color:var(--pri)}
[data-theme=dark] .nav button.on{color:#C9C2FF}
.side{padding:24px 0;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}
main{padding-bottom:48px;min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:8px}
.stat{font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);white-space:nowrap}
.fire{color:var(--fire)}.fire.off{filter:grayscale(1);color:var(--mute)}.coin{color:var(--gold-d)}.heart{color:var(--bad)}.crs{color:var(--pri)}
@media(max-width:1120px){
 .shell{grid-template-columns:minmax(0,620px);gap:0}
 .side,.logo{display:none}
 .nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;gap:0;border-right:0;border-top:1.5px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
 .nav button{flex:1;min-width:0;flex-direction:column;gap:2px;padding:4px 2px;font-size:11px;border:0;background:none!important}
 .nav button span{font-size:22px;width:44px;height:30px;display:grid;place-items:center;border-radius:99px;transition:background .15s}
 .nav button.on span{background:var(--pri-l)}
 main{padding:0 16px 104px}
}
@media(max-width:600px){.sin .btn,.lfoot .btn{width:100%}.q{font-size:23px}.bubble{font-size:17px}.pagehead h1{font-size:26px}}
@media(max-width:420px){.stat{padding:6px 9px;font-size:14px}.crs{display:none}}
/* path */
.unit{margin-top:14px}
.banner{position:sticky;top:68px;z-index:10;background:linear-gradient(120deg,var(--c),var(--c2));color:#fff;border-radius:var(--r);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden;box-shadow:0 14px 28px -16px var(--c)}
.banner::before{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-80px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.banner>*{position:relative}
.banner small{opacity:.85;font-weight:900;letter-spacing:1.2px;font-size:12px}
.banner h2{font-size:23px;margin:2px 0}.banner p{opacity:.92;font-size:15px}
.bprog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:900}
.bprog i{display:block;width:120px;height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bprog i b{display:block;height:100%;background:#fff;border-radius:99px}
.bicon{font-size:60px;line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));margin-right:-4px}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:50px 0 70px;position:relative}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.row{transform:translateX(var(--x));position:relative;display:flex;justify-content:center;z-index:1}
.node{position:relative;width:76px;height:72px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--c);box-shadow:0 7px 0 var(--d),0 14px 20px -10px var(--d);display:grid;place-items:center;color:#fff;transition:filter .15s}
.node::after{content:"";position:absolute;inset:6px;border-radius:20px;border:2.5px solid rgba(255,255,255,.35);pointer-events:none}
.node:hover{filter:brightness(1.07)}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.node.lock,.node.jump{--c:var(--lock);--d:var(--lock-d);color:var(--lock-ink)}
.node.lock{box-shadow:0 7px 0 var(--d)}
.node.lock::after{border-color:rgba(255,255,255,.45)}
.node.done{--c:var(--gold);--d:var(--gold-d)}
.node.jump{box-shadow:0 7px 0 var(--d),0 0 0 5px var(--gold-l)}
.node.cur::before{content:"";position:absolute;inset:-12px -12px -19px;border-radius:34px;border:4px solid var(--c);opacity:.25;z-index:-1}
.node svg{width:34px;height:34px}
.node .tro{font-size:34px}
.start{position:absolute;bottom:calc(100% + 18px);left:50%;translate:-50% 0;background:var(--card);border:2px solid var(--line);color:var(--c);padding:8px 14px;border-radius:14px;font-family:var(--hf);font-weight:600;font-size:16px;white-space:nowrap;z-index:2;box-shadow:var(--sh)}
.start::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border:2px solid var(--line);border-width:0 2px 2px 0;transform:translateX(-50%) rotate(45deg)}
.start.gold{color:var(--gold-d)}
.row:has(.start){margin-top:34px}
.pmascot{position:absolute;top:130px;z-index:1}
.pop{position:absolute;top:calc(100% + 22px);left:50%;translate:-50% 0;width:290px;max-width:calc(100vw - 32px);background:var(--c);color:#fff;border-radius:var(--r);padding:18px;z-index:15;box-shadow:var(--sh2)}
.pop::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop h3{font-size:20px}.pop p{opacity:.92;margin:4px 0 14px}
.pop .btn{width:100%;background:#fff;color:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.pop.lock{background:var(--card);color:var(--ink2);border:1.5px solid var(--line)}
.pop.lock h3{color:var(--ink)}
.pop.lock .btn{background:var(--soft);color:var(--mute);box-shadow:none}
.pop.jump{--c:var(--gold-d)}
/* cards & pages */
.goal{display:flex;align-items:center;gap:12px;margin-top:12px}
.goal>span{font-size:28px}
.gbar{flex:1;height:20px;background:var(--soft);border:1.5px solid var(--line);border-radius:99px;position:relative;overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#FFCB57);border-radius:99px}
.gbar em{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-style:normal;color:var(--gold-ink)}
.skill{display:flex;align-items:center;gap:12px;padding:7px 0}
.skill b{flex:1;font-size:15px}
.sbar{width:110px;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px}
.muted{color:var(--ink2);font-weight:600}
.mob{display:none}@media(max-width:1120px){.mob{display:block}}
.pagehead{display:flex;gap:18px;align-items:center;padding:6px 0 14px}
.pagehead h1{font-size:30px}.pagehead p{margin-top:2px}
.sec{font-size:20px;margin:30px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc2{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--rs);padding:14px 16px;box-shadow:var(--sh)}
.sc2 span{font-size:26px}.sc2 b{display:block;font-size:21px;font-family:var(--hf);font-weight:600}.sc2 small{color:var(--ink2)}
.list{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:0 18px;box-shadow:var(--sh)}
.list>div+div{border-top:1.5px solid var(--line)}
.ach{display:flex;gap:14px;align-items:center;padding:14px 0}
.ae{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}
.ach .ae{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.ach.no .ae{background:var(--lock);box-shadow:0 4px 0 var(--lock-d);filter:grayscale(1)}
.ach>div{flex:1;min-width:0}.ach .sbar{width:100%;margin-top:6px}
.shopitem{display:flex;gap:14px;align-items:center;padding:16px 0}
.shopitem .ae{font-size:32px;background:var(--soft)}
.shopitem>div{flex:1;min-width:0}.shopitem p{font-size:14px}
.outfits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ocard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:var(--sh);transition:border-color .15s}
.ocard.on{border-color:var(--pri-b);background:linear-gradient(180deg,var(--pri-l),var(--card) 70%)}
.ocard .ae{background:var(--soft);font-size:34px;margin-bottom:6px}
.ocard h3{font-size:16px}.ocard p{font-size:13px;flex:1;margin-bottom:10px}.ocard .btn{width:100%}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--pri-l),var(--warm));border:1.5px solid color-mix(in srgb,var(--pri-b) 55%,transparent);border-radius:var(--r);padding:20px;margin:4px 0 14px}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:color-mix(in srgb,var(--card) 35%,transparent);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:22px}.hero p{margin-top:2px}
.hero .grow{flex:1;min-width:0}
.fincard{display:flex;align-items:center;gap:16px;margin:10px 0 30px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}
.toggle>div:first-child{min-width:0}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.lesson[hidden]{display:none}
.lhead{width:100%;max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:24px 20px 10px}
.x{font-size:24px;color:var(--mute);line-height:1;width:40px;height:40px;border-radius:12px;flex:none}
.x:hover{background:var(--soft);color:var(--ink2)}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;position:relative}
.bar i::after{content:"";position:absolute;top:4px;left:8px;right:8px;height:4px;background:rgba(255,255,255,.3);border-radius:99px}
.lhearts{color:var(--bad);font-weight:900;font-size:18px;white-space:nowrap}
.stage{flex:1;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;padding:18px 20px 30px}
.q{font-size:26px;margin:6px 0 18px}.q.c{text-align:center}
.tagline{font-weight:900;color:var(--pri2);letter-spacing:1px;text-transform:uppercase;font-size:13px}
.tagline.bad{color:var(--fire)}
.talk{display:flex;align-items:flex-end;gap:6px;margin:4px 0 22px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;font-size:18px;line-height:1.45;margin-bottom:30px;flex:1;min-height:56px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:20px;width:14px;height:14px;background:var(--card);border:2px solid var(--line);border-width:0 0 2px 2px;transform:rotate(45deg)}
.art{font-size:84px;text-align:center;margin:8px auto 4px;width:150px;height:150px;border-radius:44px;background:linear-gradient(135deg,var(--gold-l),var(--pri-l));display:grid;place-items:center;transform:rotate(-4deg)}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;font-size:17px;transition:background .15s,border-color .15s}
.opt:hover{background:var(--soft)}
.opt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.opt kbd{font:inherit;font-size:13px;color:var(--mute);border:2px solid var(--line);border-radius:9px;width:28px;height:28px;display:grid;place-items:center;flex:none}
.opts.pics .opt{flex-direction:column;text-align:center;padding:18px 12px;gap:8px}
.opts.pics kbd{position:absolute;top:10px;left:10px;width:24px;height:24px;font-size:12px}
.oe{font-size:44px;line-height:1}.oe.sm{font-size:30px}
.opt.sel{background:var(--pri-l);border-color:var(--pri-b);color:var(--pri)}.opt.sel kbd{border-color:var(--pri-b);color:var(--pri)}
.opt.good{background:var(--ok-l);border-color:var(--ok);color:var(--ok-d)}
.opt.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad-d)}
[data-theme=dark] .opt.sel{color:#C9C2FF}[data-theme=dark] .opt.good{color:#5EE6B5}[data-theme=dark] .opt.bad{color:#FF9AAD}
.line{min-height:112px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 0;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.chipw{padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-size:17px;background:var(--card)}
.chipw.used{background:var(--line);color:transparent;border-color:var(--line)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match>div{display:grid;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:64px}
.opt.gone{opacity:.35;pointer-events:none;background:var(--card);border-color:var(--line);color:var(--mute)}
.lfoot{border-top:1.5px solid var(--line);padding:20px 20px calc(20px + env(safe-area-inset-bottom));background:var(--card)}
.lfoot>div{max-width:1000px;margin:0 auto;display:flex;justify-content:flex-end}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));z-index:3;visibility:hidden;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px -12px rgba(31,29,51,.2)}
.sheet.good{background:var(--ok-l);color:var(--ok-d)}.sheet.bad{background:var(--bad-l);color:var(--bad-d)}
[data-theme=dark] .sheet.good{color:#5EE6B5}[data-theme=dark] .sheet.bad{color:#FF9AAD}
.sin{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sico{width:60px;height:60px;border-radius:20px;background:var(--card);display:grid;place-items:center;font-size:32px;font-weight:900;flex:none}
.stxt{flex:1;min-width:180px}.stxt h3{font-size:24px}.stxt p{font-size:16px;margin-top:2px}.stxt .why{opacity:.85}
.combo{position:fixed;top:80px;left:50%;translate:-50% 0;background:var(--fire);color:#fff;padding:10px 18px;border-radius:99px;font-family:var(--hf);font-weight:600;font-size:19px;box-shadow:0 4px 0 var(--fire-d);z-index:5;white-space:nowrap}
.fin{text-align:center;padding-top:10px}
.fin .chip{display:block;margin:0 auto 6px}
.fin h1{font-size:34px;color:var(--pri);margin-top:8px}
.fin p{font-size:18px;color:var(--ink2);margin:6px auto 24px;max-width:440px}
.fin .btn{margin:6px}
.stats{display:flex;gap:12px;justify-content:center}
.sc{flex:1;max-width:150px;border:2px solid var(--c);border-radius:20px;background:var(--c);overflow:hidden}
.sc b{display:block;color:#fff;font-size:12px;letter-spacing:.8px;padding:6px 0}
.sc div{background:var(--card);border-radius:18px;padding:14px 0;font-size:22px;font-weight:900;color:var(--c)}
.earn{margin-top:22px;font-size:20px;font-weight:900;color:var(--gold-d)}
.flame{font-size:120px;line-height:1}
.bign{font-family:var(--hf);font-size:96px;font-weight:600;color:var(--fire);line-height:1}
.fin h1.fire{color:var(--fire)}.fin h1.bad{color:var(--bad)}
.week{display:flex;gap:10px;justify-content:center;margin:26px 0 8px}
.week div{display:grid;gap:6px;justify-items:center;color:var(--ink2);font-size:14px}
.week i{width:34px;height:34px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-style:normal;color:#fff}
.week i.on{background:var(--fire)}
/* sheets & dialogs: above the bottom nav and the lesson */
.modal{position:fixed;inset:0;background:rgba(20,18,37,.55);display:grid;place-items:end center;z-index:100}
.modal>div{position:relative;background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:30px 24px calc(24px + env(safe-area-inset-bottom));text-align:center;display:grid;gap:12px;justify-items:center;box-shadow:var(--sh2)}
.modal>div::before{content:"";position:absolute;top:10px;left:50%;translate:-50% 0;width:40px;height:5px;border-radius:99px;background:var(--line)}
@media(min-width:700px){.modal{place-items:center}.modal>div{border-radius:28px;padding-bottom:24px}.modal>div::before{display:none}}
.modal h2{font-size:24px}
.modal label{width:100%;text-align:left;font-size:14px;color:var(--ink2);display:grid;gap:6px}
input.name,textarea.name{display:block;width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:var(--rs);background:var(--card);outline:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea.name{resize:none;height:88px;line-height:1.4}
input.name::placeholder,textarea.name::placeholder{color:var(--mute)}
input.name:focus,textarea.name:focus{border-color:var(--pri-b);box-shadow:0 0 0 4px var(--pri-l)}
input.name:disabled{background:var(--soft);color:var(--mute)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
#fx i{position:absolute;top:0;left:50%;width:10px;height:14px;border-radius:3px}
.chip{overflow:visible;flex:none}
/* onboarding */
.boot{min-height:100vh;display:grid;place-items:center}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-weight:800;margin:14px 0;text-transform:uppercase;font-size:13px}.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.welcome{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px;background:radial-gradient(circle at 50% 30%,var(--pri-l),var(--bg) 62%)}
.wbox{position:relative;width:100%;max-width:400px;display:grid;justify-items:center;gap:12px;text-align:center}
.brand{font-size:60px;color:var(--pri);line-height:1;margin-top:4px}.tag{font-size:19px;color:var(--ink2);margin-bottom:18px}
.float{position:absolute;font-size:34px;opacity:.4;pointer-events:none;user-select:none}
.obtop{display:flex;align-items:center;gap:16px;max-width:640px;margin:0 auto;padding:22px 20px 6px}
.obtop .bar i{width:0}
.obbody{max-width:560px;margin:0 auto;padding:14px 20px 130px}
.obbody .talk{margin-bottom:26px}.obbody .name{margin-bottom:10px}
.obfoot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.obfoot .btn{display:flex;width:100%;max-width:560px;margin:0 auto}
.pwrap{position:relative}.pwrap .name{padding-right:54px}.eye{position:absolute;right:8px;top:7px;font-size:20px;padding:8px;opacity:.7}
.links{display:grid;justify-items:center;gap:2px;margin-top:18px}.err{color:var(--bad);min-height:22px;font-size:15px;margin:6px 0}.link{color:var(--pri);font-weight:800;padding:6px}
.gbtn{color:var(--ink)!important}
/* profile, friends, quests */
.av{font-size:54px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:3px solid var(--pri-b);flex:none;box-shadow:var(--sh)}
.hero .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media(max-width:600px){.hero .chip:last-child{display:none}.hero.ph{flex-direction:column;text-align:center}.hero.ph .acts{justify-content:center}}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:100%}.avs button{font-size:26px;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--soft);transition:border-color .15s,background .15s}
@media(max-width:420px){.avs{grid-template-columns:repeat(6,1fr)}}
.avs button.sel,.accs button.sel{border-color:var(--pri);background:var(--pri-l)}
.accs{display:flex;gap:8px}.accs button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}.accs button.sel{box-shadow:0 0 0 2px var(--ink)}
.fr{display:flex;align-items:center;gap:12px;padding:12px 0}.fr .rk{width:28px;text-align:center;color:var(--mute);flex:none}.fr .fa{font-size:30px;flex:none}.fr>div{flex:1;min-width:0}.fr>div b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr>b:not(.rk){white-space:nowrap;font-family:var(--hf);font-weight:600}
.fr .unf{width:34px;height:34px;border-radius:10px;color:var(--mute);flex:none;font-size:14px}.fr .unf:hover{background:var(--bad-l);color:var(--bad)}
.fr.me{background:var(--pri-l);margin:0 -18px;padding:12px 18px}
.list>.fr.me:last-child{border-radius:0 0 calc(var(--r) - 2px) calc(var(--r) - 2px)}.list>.fr.me:first-child{border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0}
.quest{display:flex;align-items:center;gap:12px;padding:14px 0}.quest+.quest{border-top:1.5px solid var(--line)}.quest>span{font-size:28px;flex:none}.quest>div{flex:1;min-width:0}.quest .sbar{width:100%;margin:6px 0 2px}
.side .quest{padding:10px 0}.side .quest>span{font-size:22px}
.srow{display:flex;gap:8px;margin:10px 0 4px}.srow .name{flex:1;min-width:0}.srow .btn{min-width:0;padding:12px 18px}
.asg{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:900}
.spk{float:right;margin:-4px -6px 0 8px;width:34px;height:34px;border-radius:10px;font-size:17px;opacity:.75}.spk:hover{background:var(--soft);opacity:1}
.co{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}.co .ae{width:46px;height:46px;font-size:26px;background:var(--soft);border-radius:14px}.co>div{flex:1;min-width:0}.co small{color:var(--ink2)}
.co .px{text-align:right;flex:none}.co .px b{display:block;font-family:var(--hf);font-weight:600}
.up{color:var(--ok-d)}.dn{color:var(--bad-d)}[data-theme=dark] .up{color:#5EE6B5}[data-theme=dark] .dn{color:#FF9AAD}
.spark{flex:none}@media(max-width:420px){.co .spark{display:none}}
.big{font-family:var(--hf);font-size:34px;font-weight:600;line-height:1.1}
.tip{display:flex;gap:12px;align-items:center;background:var(--gold-l);border:1.5px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:var(--rs);padding:12px 14px;margin-top:12px;font-size:15px}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}.amts .btn{min-width:0;padding:12px 6px;font-size:16px}
.note{font-size:13px;color:var(--ink2);margin-top:8px}
.optin{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:15px;cursor:pointer}
/* ---------- v2: icons, mascot motion, game systems, social ---------- */
.ic{flex:none;display:inline-block;vertical-align:middle;overflow:visible}
.ic.ci{width:1.15em;height:1.15em;vertical-align:-.22em}
.ic.gray{filter:grayscale(1);opacity:.55}
.grow{flex:1;min-width:0}.c{text-align:center}.small{font-size:14px}
/* Chip idle motion: CSS so it's cheap; paused when off screen (.zz) */
.chip{cursor:pointer}
.chip .m-root{animation:cb-bob 2.6s ease-in-out infinite;animation-delay:var(--d);transform-box:fill-box;transform-origin:50% 100%}
.chip .m-eyes{animation:cb-blink 5.2s infinite;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
.chip .m-pupils{animation:cb-look 11s ease-in-out infinite;animation-delay:var(--d)}
.chip .m-earL{animation:cb-earL 7s infinite;animation-delay:var(--d);transform-box:fill-box;transform-origin:90% 50%}
.chip .m-earR{animation:cb-earR 7s infinite;animation-delay:calc(var(--d) - 3s);transform-box:fill-box;transform-origin:10% 50%}
.chip .m-tail{animation:cb-tail 2.8s ease-in-out infinite;animation-delay:var(--d);transform-box:fill-box;transform-origin:0% 100%}
.chip .m-shadow{animation:cb-shadow 2.6s ease-in-out infinite;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
.chip .m-zz{animation:cb-zz 2.4s ease-in-out infinite}
@keyframes cb-bob{0%,100%{transform:translateY(0) scale(1.012,.988)}50%{transform:translateY(-5px) scale(.992,1.008)}}
@keyframes cb-shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.7}}
@keyframes cb-blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes cb-look{0%,38%,100%{transform:translate(0,0)}42%,56%{transform:translate(-3.5px,1px)}60%,74%{transform:translate(3.5px,-1px)}78%{transform:translate(0,0)}}
@keyframes cb-earL{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-12deg)}92%{transform:rotate(4deg)}}
@keyframes cb-earR{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(12deg)}92%{transform:rotate(-4deg)}}
@keyframes cb-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes cb-zz{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
.chip.zz *{animation-play-state:paused!important}
.chip .m-frown,.chip .m-open,.chip .m-closed,.chip .m-happy,.chip .m-brow-sad,.chip .m-zz{display:none}
.chip.mood-sad .m-smile,.chip.mood-sad .m-brow{display:none}.chip.mood-sad .m-frown,.chip.mood-sad .m-brow-sad{display:inline}
.chip.mood-wow .m-smile,.chip.mood-cheer .m-smile{display:none}.chip.mood-wow .m-open,.chip.mood-cheer .m-open{display:inline}
.chip.mood-cheer .m-eyes{display:none}.chip.mood-cheer .m-happy{display:inline}
.chip.mood-sleep .m-eyes,.chip.mood-sleep .m-smile{display:none}.chip.mood-sleep .m-closed,.chip.mood-sleep .m-zz,.chip.mood-sleep .m-frown{display:inline}
.chip.mood-think .m-pupils{animation:none;transform:translate(4px,-4px)}.chip.mood-think .m-head{transform:rotate(-5deg);transform-origin:100px 140px}
@media(prefers-reduced-motion:reduce){.chip *,.start{animation:none!important}}
/* avatars */
.avc{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--soft);flex:none;line-height:1;vertical-align:middle}
.avc img,.avc svg{width:100%;height:100%;object-fit:cover;display:block}
.avc.emo{background:var(--pri-l)}
/* top bar + nav */
.stat{cursor:pointer;transition:transform .1s,background .15s}.stat:hover{background:var(--soft)}.stat:active{transform:scale(.95)}
.stat.gems{color:var(--sky-d)}[data-theme=dark] .stat.gems{color:#7FD3FF}.stat.boost{color:var(--pri2)}
.stat.crs span{color:var(--ink2)}
.nav button span{position:relative;width:40px;height:36px;display:grid;place-items:center}
.nav .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-style:normal;font-weight:900;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
@media(max-width:1120px){.nav button span{width:44px;height:32px}.nav button span .ic,.nav button span .avc{width:26px!important;height:26px!important}}
@media(max-width:400px){.nav button b{font-size:10px}.nav button span{width:38px}}
@media(max-width:360px){.nav button b{display:none}}
/* path: popups above the sticky chapter banners */
.row.popped{z-index:16}
.pop{translate:calc(-50% - var(--x,0px)) 0;width:300px}
.pop::before{left:calc(50% + var(--x,0px))}
.start{animation:start-bob 1.6s ease-in-out infinite}
@keyframes start-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.node.lock .ic{color:var(--lock-ink)}
/* cards */
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead .link{font-size:14px;padding:4px 0;text-transform:uppercase;letter-spacing:.5px}
.qbar{position:relative;height:16px;background:var(--soft);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.qbar.big{height:22px;flex:1}
.qbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#FFD84D,var(--gold));border-radius:99px;transition:width .5s}
.qbar i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;background:rgba(255,255,255,.45);border-radius:99px}
.qbar em{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:900;color:var(--gold-ink)}
.qbar.big em{font-size:12px}
.goal .ic{flex:none}
.quest{display:flex;align-items:center;gap:12px;padding:14px 0}.quest+.quest{border-top:1.5px solid var(--line)}.quest>div{flex:1;min-width:0}.quest b{font-size:15px}
.quest.got{opacity:.7}.qok{width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.side .quest{padding:10px 0}
.chestrow{display:flex;align-items:center;gap:14px;margin-top:6px;padding-top:14px;border-top:1.5px solid var(--line)}.chestrow>div{flex:1}
.month .mhead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:14px}.badges>div{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.badges .empty{display:flex;align-items:center;gap:14px;justify-items:start}
.lgmini{display:flex;align-items:center;gap:12px;margin-top:10px}
/* modals & celebrations */
.modal{animation:fade .2s}@keyframes fade{from{background:transparent}}
.modal>div{gap:10px}.modal.tall>div{max-height:94vh}
.celeb-art{display:grid;place-items:center;min-height:120px}
.bigicon{width:120px;height:120px;border-radius:36px;display:grid;place-items:center;font-size:66px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.lvlbig{position:relative;display:grid;place-items:center}.lvlbig b{position:absolute;font-family:var(--hf);font-size:36px;color:#7A4E00;padding-top:8px}
.notify{position:fixed;top:12px;left:50%;translate:-50% 0;z-index:200;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:10px 18px 10px 12px;box-shadow:var(--sh2);max-width:calc(100vw - 24px)}

.fly{position:fixed;left:0;top:0;z-index:300;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pills span{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:14px}
.hrow{display:flex;gap:6px}
.week i.frz{background:#CFF1FF}
.week i .ic{color:#fff}
/* shop */
.shopitem .ae{background:var(--soft);display:grid;place-items:center}
.ocard .oprev{height:96px;display:grid;place-items:center;margin-bottom:4px}
.tip .ic{flex:none}
.tip{margin-top:16px}
/* leagues */
.lghead{text-align:center;padding:8px 0 14px}.lghead h1{font-size:28px;margin-top:6px}.lghead p{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.tiers{display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;padding:6px 0}
.tiers span{transition:transform .2s}.tiers .off{filter:grayscale(1);opacity:.35}.tiers .on{transform:translateY(-2px)}
@media(max-width:520px){.tiers span:not(.on) .ic{width:26px;height:26px}}
.board{padding:6px 12px}
.fr{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px}
button.fr:hover{background:var(--soft)}
.list>.fr+.fr,.list>.zone+.fr,.list>.fr+.zone{border-top:0}
.fr .rk{width:30px;display:grid;place-items:center;font-family:var(--hf);color:var(--ink2);flex:none}
.fr.pz .rk{color:var(--ok-d)}.fr.dz .rk{color:var(--bad-d)}
.fr.me{background:var(--pri-l);margin:0;padding:10px 6px}
.fr>div{flex:1;min-width:0}.fr>div b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr small{display:flex;align-items:center;gap:4px}
.fr>b:last-child,.fr>b:nth-last-child(1){white-space:nowrap;font-family:var(--hf);font-weight:600}
.ic.m1{filter:grayscale(1) brightness(1.15)}.ic.m2{filter:sepia(1) hue-rotate(-25deg) saturate(1.6) brightness(.85)}

.zone.up{color:var(--ok-d)}.zone.dn{color:var(--bad-d)}

.lvl{margin-top:14px}
.grid2 .sc2 .ic{flex:none}.grid2.mini{width:100%}.grid2.mini .sc2{padding:10px 12px;text-align:left}.grid2.mini .sc2 b{font-size:17px}
.xpchart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px}

.achs{display:grid}.achs .ach{display:flex;gap:14px;align-items:center;padding:12px 0}.achs .ach+.ach{border-top:1.5px solid var(--line)}

.feed.new p{color:var(--pri)}
.segs{display:flex;background:var(--soft);border-radius:14px;padding:4px;width:100%;gap:4px}.segs button{flex:1;padding:9px 6px;border-radius:11px;font-family:var(--hf);color:var(--ink2)}.segs button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.plist{width:100%;max-height:50vh;overflow-y:auto}.plist .fr+.fr{border-top:1.5px solid var(--line)}
.avprev{margin:4px 0}
.avpane{width:100%}.upl{cursor:pointer}
.bprev{padding:6px}.bcats{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:4px;scrollbar-width:none}
.bcats button{white-space:nowrap;padding:8px 12px;border-radius:99px;border:2px solid var(--line);font-size:14px;color:var(--ink2)}.bcats button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-l)}
.bopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;width:100%;max-height:34vh;overflow-y:auto;padding:2px}
.bopts button{position:relative;border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink2);background:var(--card)}
.bopts button.sel{border-color:var(--pri);background:var(--pri-l)}.bopts button i{width:44px;height:44px;border-radius:50%;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.bopts button.lock{opacity:.55;cursor:not-allowed}.bopts button em{position:absolute;inset:auto 4px 4px;font-style:normal;font-size:11px;font-weight:900;background:var(--ink);color:var(--card);border-radius:99px;padding:2px 4px;display:flex;align-items:center;justify-content:center;gap:2px}
/* settings */
.toggle{gap:14px}.toggle .ic{flex:none}
/* practice hub */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);transition:transform .1s,background .15s}
.mode:hover{background:var(--soft)}.mode:active{transform:translateY(2px);border-bottom-width:3px}
.mode>div{flex:1;min-width:0}.mode b{display:block;font-family:var(--hf);font-weight:600;font-size:18px}.mode small{color:var(--ink2);font-size:13px}
.mode em{font-style:normal;font-size:13px;background:var(--pri-l);color:var(--pri);border-radius:99px;padding:4px 8px}
.mode.off{opacity:.6}.mode .lk{color:var(--lock-ink)}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.story{display:grid;justify-items:center;gap:6px;text-align:center;padding:16px 10px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r)}
.story:hover{background:var(--soft)}.story b{font-family:var(--hf);font-weight:600;font-size:16px}.story small{font-size:12px}
.sart{position:relative;width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--gold-l),var(--pri-l));transform:rotate(-4deg)}
.sart i{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;border:3px solid var(--card)}
.story.off{opacity:.55}.story.off .sart{background:var(--lock);color:var(--lock-ink)}
/* lesson: new exercise types */
.lhearts{display:flex;align-items:center;gap:6px}
.sico{color:inherit}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 24px}
.play{width:110px;height:110px;border-radius:28px;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--sky-d)}
.play.slow{width:70px;height:70px;border-radius:20px}.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
.flash{display:block;width:100%;max-width:420px;height:240px;margin:20px auto;perspective:900px;position:relative}
.flash>div{position:absolute;inset:0;border-radius:28px;display:grid;place-content:center;gap:10px;padding:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s cubic-bezier(.3,1.4,.6,1);border:2px solid var(--line);border-bottom-width:6px}
.flash .ff{background:linear-gradient(135deg,var(--pri-l),var(--card));}.flash .fb{background:var(--card);transform:rotateY(180deg)}
.flash b{font-family:var(--hf);font-size:32px;color:var(--pri)}.flash p{font-size:19px}.flash small{color:var(--mute)}
.flash.flip .ff{transform:rotateY(-180deg)}.flash.flip .fb{transform:rotateY(0)}
.micbtn{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto;width:100%;max-width:360px;padding:18px;border-radius:20px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;font-family:var(--hf);font-size:18px;color:var(--sky-d)}
.micbtn.rec{border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--bad-l)}}
.hitw{color:var(--ok-d);text-decoration:underline 3px var(--ok)}
.lfoot>div{align-items:center;gap:12px}.skip{margin-right:auto;white-space:nowrap;font-size:15px}
.storyhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.storyhead span{font-size:40px}.storyhead h2{font-size:22px}
.sline{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}.sline>div{background:var(--card);border:2px solid var(--line);border-radius:4px 18px 18px 18px;padding:10px 14px;flex:1}
.sline b{font-size:13px;color:var(--pri2);text-transform:uppercase;letter-spacing:.6px}.sline p{font-size:17px;line-height:1.4}.sline.chipln>div{border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:var(--gold-l)}
.sline:not(.cur){opacity:.75}
.passage{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;font-size:17px;line-height:1.55;margin-bottom:18px}
.bubble.qb{margin:0 0 16px;flex:none}.bubble.qb::before{display:none}
.combo{display:flex;align-items:center;gap:6px}
</style>

<body>
<div id="app"></div>
<div id="lesson" class="lesson" hidden></div>
<div id="fx"></div>
<script>
/* ---------- content ---------- */
const I=(title,text,art)=>({t:'info',title,text,art});
const M=(q,opts,a,why,tag)=>{const o=opts.map(s=>{const [e,l]=s.includes('|')?s.split('|'):['',s];return{e,l}});return{t:'mc',q,opts:o,ans:o[a].l,why,tag}};
const T=(q,v,why,tag)=>({t:'mc',tf:1,q,opts:[{e:'👍',l:'True'},{e:'👎',l:'False'}],ans:v?'True':'False',why,tag});
const B=(q,answer,extra,tag)=>({t:'build',q,answer,extra,tag});
const P=(pairs,tag)=>({t:'match',pairs,tag});

const TAGS={share:'What a stock is',owner:'Being an owner',why:'Why companies sell',ipo:'IPOs',price:'Price moves',gain:'Gains & losses',div:'Dividends',market:'The market',ticker:'Ticker symbols',supply:'Supply & demand',risk:'Risk & diversifying',long:'Long-term thinking'};

const COURSE=[
{title:"What's a Stock?",sub:'Own a slice of a company',color:'#5B4CF5',c2:'#8B5CF6',dark:'#4031D4',icon:'🍕',lessons:[
 {title:'Own a Slice',items:[
  I('Meet the stock!','A company is like a giant pizza 🍕. A <b>stock</b> (also called a <b>share</b>) is one slice. Buy a slice and you own a tiny piece of the company!','🍕'),
  M('What is a stock?',['🍕|A piece of a company','🏦|A kind of bank','🎟️|A movie ticket','🧸|A toy you rent'],0,'A stock is a small piece of ownership in a company.','share'),
  T('If you own a share of a company, you own a tiny part of it.',true,'Yep! Owning shares makes you a part-owner.','owner'),
  I('Shareholders','People who own stocks are called <b>shareholders</b>. Even kids can be shareholders — with a grown-up’s help!','🙋'),
  M('Someone who owns stock is called a…',['🧑‍🍳|Chef','🙋|Shareholder','👮|Guard','🧑‍🏫|Teacher'],1,'Shareholder = someone who holds shares.','owner'),
  B('So… what is a stock?','A stock is a piece of a company',['bank','toy'],'share'),
  P([['Company','Whole pizza'],['Stock','One slice'],['Shareholder','Slice owner'],['Buy','Get a slice']],'share')]},
 {title:'Why Sell Shares?',items:[
  I('Growing costs money','Maya’s lemonade stand is a hit! 🍋 She wants a second stand but needs $100. She can <b>sell shares</b> to friends to raise the money.','🍋'),
  M('Why do companies sell stock?',['💰|To raise money to grow','🎉|To throw parties','🧹|To clean the office','😴|To take a nap'],0,'Selling shares brings in money to build and grow.','why'),
  T('When Maya sells shares, her friends become part-owners of the stand.',true,'Buying shares = owning a piece.','owner'),
  M('Maya sells 10 shares for $10 each. How much does she raise?',['$10','$100','$1,000','$1'],1,'10 × $10 = $100.','why'),
  I('The IPO','When a company sells shares to the public for the very first time, it’s called an <b>IPO</b> — an Initial Public Offering. It’s the company’s big debut! 🎤','🎤'),
  M('What does IPO stand for?',['Initial Public Offering','Internet Pizza Order','Important Price Oops','Invest, Pay, Owe'],0,'IPO = Initial Public Offering.','ipo'),
  B('Why do companies sell shares?','Companies sell shares to raise money',['spend','toys'],'why')]},
 {title:'Up & Down',items:[
  I('Prices move!','A stock’s price changes every day. When lots of people want it, the price goes <b>up</b> 📈. When fewer people want it, it goes <b>down</b> 📉.','📈'),
  M('Lots of people suddenly want SuperSneaks stock. What likely happens?',['📈|Price goes up','📉|Price goes down','➖|Nothing ever','❌|The stock vanishes'],0,'More buyers usually push the price up.','price'),
  T('A stock’s price stays the same forever once you buy it.',false,'Prices change all the time!','price'),
  I('Gains & losses','Buy at $5, sell at $8? You <b>gained</b> $3 🎉. Buy at $5, sell at $3? That’s a $2 <b>loss</b>. Stocks can go down too.','⚖️'),
  M('You buy a share for $5 and sell it for $8. What’s your gain?',['$3','$8','$13','$5'],0,'$8 − $5 = $3 gain.','gain'),
  M('You buy for $10 and sell for $7. What happened?',['📉|You lost $3','📈|You gained $3','🤷|Nothing happened','🚀|You gained $17'],0,'$7 − $10 = −$3, a loss.','gain'),
  P([['📈','Price up'],['📉','Price down'],['Gain','Sold for more'],['Loss','Sold for less']],'gain')]},
 {title:'Owner Perks',items:[
  I('Dividends','Some companies share their profits with shareholders. These payments are called <b>dividends</b> — like a thank-you bonus! 🎁','🎁'),
  M('A dividend is…',['🎁|Profit paid to owners','🧾|A bill you pay','🏷️|A coupon','📦|A free product'],0,'Dividends are a slice of profits paid to shareholders.','div'),
  T('Every company pays dividends.',false,'Many growing companies keep profits to grow instead.','div'),
  I('You get a vote','Shareholders can <b>vote</b> on big company decisions. More shares = more votes! 🗳️','🗳️'),
  M('How can shareholders help make company decisions?',['🗳️|By voting','📣|By yelling','🖍️|By drawing on walls','🎲|By rolling dice'],0,'Owners vote at shareholder meetings.','owner'),
  B('What perks do shareholders get?','Shareholders can vote and may get dividends',['never','pizza'],'div')]},
 {title:'Chapter Review',check:1}]},
{title:'The Stock Market',sub:'Where stocks are bought & sold',color:'#0FB5AE',c2:'#1FA2FF',dark:'#0A8A85',icon:'🏛️',lessons:[
 {title:'The Big Market',items:[
  I('The stock market','The <b>stock market</b> is where people buy and sell stocks — like a giant farmers’ market, but for pieces of companies! 🏪','🏪'),
  M('What happens at the stock market?',['🛒|People trade stocks','🥕|Only veggies are sold','🎢|Roller coaster rides','📚|Library books'],0,'It’s a marketplace for stocks.','market'),
  I('Exchanges','Stocks trade on <b>exchanges</b> like the New York Stock Exchange (NYSE) and the Nasdaq. Today, most trading happens on computers! 💻','🏛️'),
  T('Most stock trading today happens on computers.',true,'Yep — trades zip around in milliseconds.','market'),
  M('Which of these is a stock exchange?',['🏛️|NYSE','🍔|NYPD','🏈|NFL','🚀|NASA'],0,'NYSE = New York Stock Exchange.','market'),
  B('Where do people trade stocks?','The stock market is where people trade stocks',['eat','sleep'],'market')]},
 {title:'Ticker Symbols',items:[
  I('Ticker symbols','Every stock has a short nickname called a <b>ticker symbol</b>. Apple is <b>AAPL</b>, Disney is <b>DIS</b>, Nike is <b>NKE</b>.','🏷️'),
  P([['AAPL','Apple 🍎'],['DIS','Disney 🏰'],['NKE','Nike 👟'],['MCD','McDonald’s 🍟']],'ticker'),
  M('What is a ticker symbol?',['🏷️|A stock’s nickname','⏰|A kind of clock','🐛|A tiny bug','🎫|A lottery ticket'],0,'Tickers are short codes for stocks.','ticker'),
  M('Which ticker belongs to Disney?',['DIS','DSN','MICKEY','DNY'],0,'Disney trades as DIS.','ticker'),
  T('Ticker symbols are usually just a few letters long.',true,'Usually 1–5 letters.','ticker')]},
 {title:'Supply & Demand',items:[
  I('Supply & demand','When more people want to <b>buy</b> (demand) than <b>sell</b> (supply), prices rise. Like the hottest toy at the holidays! 🧸','🧸'),
  M('Everyone wants the new RoboPup, but stores have only a few. The price will probably…',['📈|Go up','📉|Go down','🧊|Freeze','🎈|Float away'],0,'High demand + low supply = higher price.','supply'),
  M('A company has bad news and lots of people want to sell. The price will probably…',['📉|Go down','📈|Go up','🔁|Double','🤐|Stay secret'],0,'More sellers than buyers pushes price down.','supply'),
  T('Demand means how many people want to buy something.',true,'Right! Supply is how much is for sale.','supply'),
  P([['High demand','Price rises'],['Low demand','Price falls'],['Supply','Amount for sale'],['Demand','Amount wanted']],'supply')]},
 {title:'Egg Baskets',items:[
  I('Risk','Stocks can go up <i>or</i> down, so investing has <b>risk</b>. You could lose money — that’s why smart investors are careful. ⚠️','⚠️'),
  I('Diversify!','Don’t put all your eggs in one basket! Owning <b>many different</b> stocks means one bad egg won’t ruin everything.','🧺'),
  M('What does diversifying mean?',['🧺|Owning many different things','🥚|Buying just one stock','🎰|Guessing randomly','💸|Spending it all'],0,'Spread out = safer.','risk'),
  M('Which basket is safer?',['🧺|10 different companies','🥚|Just 1 company'],0,'If one company struggles, the others can help.','risk'),
  T('Investing in stocks has no risk at all.',false,'All investing has some risk.','risk'),
  B('What’s the golden rule?','Do not put all your eggs in one basket',['two','chicken'],'risk')]},
 {title:'Think Long-Term',items:[
  I('Patience is a superpower','Over many years, the stock market has generally grown — even with bumpy days along the way. Slow and steady! 🐢','🐢'),
  I('Compound growth','When your money grows, the growth can grow too! Like a snowball rolling downhill, it gets bigger and bigger. ⛄','⛄'),
  M('Why is investing for a long time helpful?',['🐢|Growth has time to build','⚡|You get rich overnight','🎲|It removes all risk','🙈|You never need to learn'],0,'Time lets compound growth do its magic.','long'),
  M('The market drops for a week. What might a patient investor do?',['🧘|Stay calm, think long-term','😱|Panic and sell everything','🙈|Throw away the computer','🍦|Only eat ice cream'],0,'Short dips are normal over the long run.','long'),
  P([['Snowball','Compound growth'],['Turtle','Patience'],['Basket','Diversify'],['Ticker','Stock nickname']],'long')]},
 {title:'Chapter Review',check:1}]}];
{const m=MORE_CHAPTERS(I,M,T,B,P);Object.assign(TAGS,m.tags);COURSE.push(...m.chapters)}

const FLAT=[];COURSE.forEach((c,ci)=>c.lessons.forEach((l,li)=>{l.id=`c${ci+1}l${li+1}`;l.ch=ci;(l.items||[]).forEach((it,k)=>it.key=l.id+':'+k);FLAT.push(l)}));
const LESSON=Object.fromEntries(FLAT.map(l=>[l.id,l]));
const ITEM=Object.fromEntries(FLAT.flatMap(l=>(l.items||[]).map(i=>[i.key,i])));

/* ---------- state ---------- */
const KEY='chip-stocks-v1',REGEN=20*60e3;
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString('en-CA')};
const DEF={name:'',goal:20,xp:0,coins:60,gems:150,hearts:5,heartsAt:Date.now(),streak:0,best:0,lastDay:'',days:[],frozen:[],done:{},mastery:{},daily:{day:'',xp:0},hist:{},secs:0,owned:[],wear:[],sound:true,emailOptIn:true,level:0,lessons:0,perfects:0,joined:day(),
 username:'',bio:'',avatar:'🐂',avMode:'emoji',char:null,photo:'',photoPublic:false,theme:'light',accent:0,social:false,parentEmail:'',classCode:'',tts:false,fund:{h:{},n:0},friends:[],seenFol:[],
 freezes:0,amulet:0,lostStreak:null,boostUntil:0,week:{id:'',xp:0},quests:{day:''},qdone:0,monthly:{id:'',n:0},badges:[],ach:{},league:{tier:0,week:'',snap:[],best:0,wins:0,top3:0},
 words:{},stories:{},mistakes:[],feed:[],lastOpen:'',achSeen:0};
const blank=()=>({...structuredClone(DEF),heartsAt:Date.now(),joined:day()});
let S;try{S={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{S=blank()}
let user=null,syncOK=false,syncT,pending=null;
// first-party analytics: daily counters in Firestore, no third-party trackers (kids' app)
window.TQ=[];
function track(ev,once){try{if(once){const t=JSON.parse(localStorage.getItem('chip-t')||'{}');if(t[ev])return;t[ev]=1;localStorage.setItem('chip-t',JSON.stringify(t))}}catch{}
 const id=new Date().toISOString().slice(0,10)+'_'+ev;window.cloud?cloud.track(id).catch(()=>{}):TQ.push(id)}
// debounced cloud write; the snapshot is bound to its uid so a sign-out/sign-in can never cross accounts
const flush=()=>{clearTimeout(syncT);if(pending){const[uid,d,pb,mm]=pending;pending=null;cloud.save(uid,d).catch(console.error);if(pb)cloud.saveProfile(uid,pb).catch(console.error);if(mm)cloud.saveMember(mm[0],uid,mm[1]).catch(console.error)}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}
 if(user&&syncOK){pending=[user.uid,{...structuredClone(S),email:user.email,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,updatedAt:Date.now(),summary:summary()},pub(),mem()];clearTimeout(syncT);syncT=setTimeout(flush,800)}};
// read by the parent dashboard and the weekly parent email
const summary=()=>({weekId:S.week.id,weekXp:S.week.xp,lessons:S.lessons,streak:streakNow(),active7:S.days.filter(d=>d>=day(-6)).length,chapter:COURSE[LESSON[curLesson()]?.ch]?.title||'Finished every chapter',
 strong:Object.keys(S.mastery).filter(k=>strength(k)>=.6).sort((a,b)=>strength(b)-strength(a)).slice(0,3).map(k=>TAGS[k]),weak:weakTags().filter(k=>strength(k)<.6).slice(0,3).map(k=>TAGS[k]),fund:fundStats(),friendsOn:S.social});
const mem=()=>S.classCode?[S.classCode,{name:S.name.slice(0,20),avatar:S.avatar,xp:S.xp,lessons:S.lessons,streak:streakNow(),weekId:S.week.id,weekXp:S.week.xp,chapter:summary().chapter,weak:summary().weak,updatedAt:Date.now()}]:null;
// public profile is opt-in (parent consent) and carries no real name or bio; a photo is shared only if the learner chose to
const pub=()=>{if(!S.social||!S.username)return null;const photo=S.avMode==='photo'&&S.photoPublic&&okPhoto(S.photo);
 return{username:S.username,avatar:S.avatar,avMode:photo?'photo':S.avMode==='char'||S.avMode==='photo'&&S.char?'char':'emoji',char:S.char||null,photo:photo?S.photo:'',xp:S.xp,streak:streakNow(),weekId:wk(),weekXp:weekXP(),
  league:S.league.tier,level:level(),feed:(S.feed||[]).slice(0,10),following:S.friends.slice(0,200),updatedAt:Date.now()}};
addEventListener('pagehide',flush);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pick=a=>a[Math.random()*a.length|0];
const streakNow=()=>[day(),day(-1)].includes(S.lastDay)?S.streak:0;
const dailyXP=()=>S.daily.day===day()?S.daily.xp:0;
const wk=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('en-CA')};
const weekXP=()=>S.week.id===wk()?S.week.xp:0;
const boosted=()=>Date.now()<S.boostUntil;
const ACCENTS=[['#5B4CF5','#4031D4','#8B5CF6'],['#10B981','#0A9467','#34D399'],['#1FA2FF','#0B84DB','#60C3FF'],['#FF5470','#DE3355','#FF8FA3'],['#FF7A1A','#D95F08','#FFB31A']];
function applyTheme(){const r=document.documentElement,a=ACCENTS[S.accent]||ACCENTS[0],dk=S.theme==='dark'||S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'dark':'light';[['--pri',a[0]],['--pri-d',a[1]],['--pri2',a[2]]].forEach(([k,v])=>r.style.setProperty(k,v))}
function regen(){if(S.hearts>=5){S.heartsAt=Date.now();return}const n=Math.floor((Date.now()-S.heartsAt)/REGEN);if(n>0){S.hearts=Math.min(5,S.hearts+n);S.heartsAt+=n*REGEN}}
const nextHeartMin=()=>Math.ceil((REGEN-(Date.now()-S.heartsAt))/60e3);
const curLesson=()=>FLAT.find(l=>!S.done[l.id])?.id;

/* ---------- adaptive engine: Leitner boxes per concept ---------- */
const INTERVAL=[0,1,2,4,7,14]; // days until a concept is "due" again, by box
function mark(tag,ok){if(!tag)return;const m=S.mastery[tag]||{box:0,due:0,seen:0,right:0};m.seen++;if(ok){m.right++;m.box=Math.min(5,m.box+1)}else m.box=0;m.due=Date.now()+INTERVAL[m.box]*864e5;S.mastery[tag]=m}
const strength=t=>(S.mastery[t]?.box||0)/5;
const gradable=ls=>ls.flatMap(l=>(l.items||[]).filter(i=>i.t!=='info'));
// score = weakness + overdue bonus + jitter; swap for per-item SM-2 if content grows large
function pickPractice(){const now=Date.now();return gradable(FLAT.filter(l=>S.done[l.id])).map(i=>{const m=S.mastery[i.tag]||{box:0,due:0};return[i,(1-m.box/5)*2+(m.due<=now)+(S.mistakes.includes(i.key)?1:0)+Math.random()*.6]}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}
const weakTags=()=>Object.keys(S.mastery).filter(k=>TAGS[k]).sort((a,b)=>strength(a)-strength(b)||(S.mastery[a].right/S.mastery[a].seen)-(S.mastery[b].right/S.mastery[b].seen));

/* ---------- sound ---------- */

let PR=null;fetch('prices.json').then(r=>r.json()).then(j=>{PR=j;if(['fund','learn'].includes(tab)&&$('.shell'))go()}).catch(()=>{});
const px=t=>PR?.p?.[t]?.at(-1)||0,chg=t=>{const a=PR?.p?.[t];return a&&a.length>21?(a.at(-1)/a.at(-22)-1)*100:0};

 const st=fundStats(),gain=st.value-st.cost,H=Object.entries(S.fund.h),top=H.map(([t,x])=>x.sh*px(t)).sort((a,b)=>b-a)[0]||0;

<script type="module">
const V='https://www.gstatic.com/firebasejs/11.0.2/';
const [{initializeApp},A,F]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(V+f)));
const app=initializeApp(window.FIREBASE_CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);

try{if(localStorage.getItem('chip-emu')){A.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});F.connectFirestoreEmulator(db,'127.0.0.1',8080)}}catch{}
window.cloud={
 google:()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()),

 signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),

 // usernames/{name} → {uid}: a transaction makes the claim atomic, the rules make it unforgeable

 findUser:u=>F.getDoc(F.doc(db,'usernames',u)).then(c=>c.exists()?F.getDoc(F.doc(db,'profiles',c.data().uid)).then(s=>s.exists()?{uid:s.id,...s.data()}:null):null),
 profiles:uids=>Promise.all(uids.map(u=>F.getDoc(F.doc(db,'profiles',u)).then(s=>s.exists()?{uid:u,...s.data()}:null))).then(a=>a.filter(Boolean)),
 followersList:uid=>F.getDocs(F.query(F.collection(db,'profiles'),F.where('following','array-contains',uid),F.limit(200))).then(q=>q.docs.map(d=>({uid:d.id,...d.data()}))),
 // two equality filters need no composite index
 league:(tier,week)=>F.getDocs(F.query(F.collection(db,'profiles'),F.where('league','==',tier),F.where('weekId','==',week),F.limit(60))).then(q=>q.docs.map(d=>({uid:d.id,...d.data()}))),
 track:id=>F.setDoc(F.doc(db,'metrics',id),{n:F.increment(1)},{merge:true}),
 getClass:c=>F.getDoc(F.doc(db,'classes',c)).then(s=>s.exists()?{code:c,...s.data()}:null),
 members:c=>F.getDocs(F.collection(db,'classes',c,'members')).then(q=>q.docs.map(d=>({uid:d.id,...d.data()}))),
 saveMember:(c,uid,d)=>F.setDoc(F.doc(db,'classes',c,'members',uid),d),

 // FCM token lives on the user doc (outside app state) so the streak script can push to every device
 pushOn:async uid=>{const M=await import(V+'firebase-messaging.js'),t=await M.getToken(M.getMessaging(app),{vapidKey:self.FIREBASE_VAPID_KEY,serviceWorkerRegistration:await navigator.serviceWorker.ready});await F.updateDoc(F.doc(db,'users',uid),{push:F.arrayUnion(t)});return t},
